<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out – Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/tstyle.css">
<style>
main{max-width:1320px;margin:0 auto;padding:28px 40px 40px;display:flex;flex-direction:column;gap:26px}
h1{font-size:38px;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:10px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cls{position:relative;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.cls.live{border:2px solid var(--good)}
.cls h3{font-size:21px}
.cls .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cls .ln{font-size:15px;color:var(--mut);line-height:1.4;min-height:42px}
.cls .go{margin-top:4px;min-height:48px;font-size:17px;font-weight:700}
.dots{background:none;border:0;width:36px;height:36px;border-radius:8px;font-size:20px;line-height:1;color:var(--mut)}
.dots:hover{background:#F3F5F7}
.newc{border:2px dashed #AEB9C4;border-radius:16px;min-height:150px;background:transparent;font-weight:700;font-size:16px;color:#394551;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.setc{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.setc .hd{display:flex;gap:12px;align-items:center}
.tile{flex:none;width:44px;height:44px;border-radius:12px}
.two{display:flex;gap:16px;flex-wrap:wrap}
.two>.card{padding:16px 18px;flex:1 1 420px}
.two .bk{flex:0 1 420px}
.bk.stale{background:var(--amber);border-color:var(--amber-b)}
.bk.stale .t{color:var(--amber-d)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.shelf>div{display:flex;align-items:center;gap:12px}
@media(max-width:700px){main{padding:20px 16px 32px}h1{font-size:30px}.tb{padding:0 12px}}
</style>
</head>
<body>
<div class="tb">
 <a class="logo" href="/teacher"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#7DB8F5" stroke-width="2.5"/><circle cx="15" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="15" r="2.5" fill="#F2A65A"/></svg>Draw It Out</a>
 <div class="grp"><a class="b dk" href="/class?demo=1" style="text-decoration:none">Try the demo</a><a class="b dk" href="/start" style="text-decoration:none">Help</a></div>
</div>
<main>
 <div>
  <h1>Today</h1>
  <div class="mut" style="margin-top:4px;font-size:18px">Pick a class to start. Students join with the class code.</div>
 </div>

 <section class="sec">
  <div class="lbl">Your classes</div>
  <div class="grid" id="classes"></div>
  <div class="mut" id="conn" style="font-size:14px"></div>
 </section>

 <section class="sec">
  <div class="sech">
   <div class="lbl">Your question sets</div>
   <div style="display:flex;gap:8px">
    <button class="b" id="imp">Import a file</button>
    <input type="file" id="impfile" accept=".json,application/json" hidden>
    <button class="b" id="newset">+ New set</button>
   </div>
  </div>
  <div class="grid" id="sets"></div>
 </section>

 <section class="two">
  <div class="card">
   <div class="sech" style="margin-bottom:12px"><h3 style="font-size:20px">Starter sets</h3><button class="b" id="allst">See all</button></div>
   <div class="shelf" id="shelf"></div>
  </div>
  <div class="card bk" id="bk">
   <div class="t" style="font-weight:800;font-size:17px" id="bkt"></div>
   <div class="mut" style="margin:6px 0 10px;font-size:15px" id="bkd"></div>
   <div style="display:flex;gap:8px"><button class="b pri" id="bkup" style="flex:1">Back up now</button><button class="b" id="rst" style="flex:1">Restore</button></div>
   <input type="file" id="restore" accept=".json,application/json" hidden>
  </div>
 </section>
</main>
<div id="toast" hidden></div>
<script src="/common.js"></script>
<script src="/sortkit.js"></script>
<script src="/tcommon.js"></script>
<script>
if (DEMO) location.replace('/class?demo=1');
const TILE = ['#8A5A2B', '#B3261E', '#0A74A8', '#B4540A', '#4B5A6B', '#2E9B5E', '#7A4FBF', '#854d0e'];
const tileOf = s => TILE[[...s.id].reduce((a, c) => a + c.charCodeAt(0), 0) % TILE.length];
const live = {}; // code -> { live, here }
const lastSet = c => store['do_last_' + c] || '';
let menu = null;
const closeMenu = () => { if (menu) { menu.remove(); menu = null; } };
document.addEventListener('click', e => { if (menu && !menu.contains(e.target) && !e.target.closest('.dots')) closeMenu(); });

function renderClasses() {
  const box = $('#classes'); box.innerHTML = '';
  const next = periods.find(p => !(live[p.code] && live[p.code].live)); // the first class that isn't running gets the blue button
  periods.forEach(p => {
    const tm = loadTM(p.code), st = live[p.code] || {}, c = el('div', { className: 'card cls' + (st.live ? ' live' : '') });
    const top = el('div', { className: 'row1' }, el('h3', { textContent: p.name }), el('div', { style: 'display:flex;align-items:center;gap:4px' },
      el('span', { className: 'chip' + (st.live ? ' live' : ''), textContent: st.live ? 'Live now' : 'Ready' }),
      el('button', { className: 'dots', textContent: '⋯', title: 'Rename or remove this class', onclick: e => classMenu(p, c, e) })));
    const n = tm.roster.length, teams = tm.teams.length;
    const l1 = (n ? n + ' students' : 'No class list') + ' · ' + (teams ? teams + ' teams' : 'no teams');
    const l2 = st.live ? st.here + ' here now' + (lastSet(p.code) ? ' · ' + lastSet(p.code) : '') : (lastSet(p.code) ? 'Last: ' + lastSet(p.code) : 'Code ' + p.code);
    const ln = el('div', { className: 'ln' }); ln.append(document.createTextNode(l1), document.createElement('br'), document.createTextNode(l2));
    const go = el('button', { className: 'b go ' + (st.live ? 'good' : p === next ? 'pri' : ''), textContent: st.live ? 'Go back to class' : 'Start class', onclick: () => (location.href = '/class?code=' + p.code) });
    c.append(top, ln, go); box.append(c);
  });
  box.append(el('button', { className: 'newc', onclick: addClass }, el('span', { textContent: '+', style: 'font-size:28px;line-height:1' }), document.createTextNode('New class')));
}
function classMenu(p, card, e) {
  e.stopPropagation(); const had = menu; closeMenu(); if (had && had.dataset.code === p.code) return;
  menu = el('div', { className: 'menu' }); menu.dataset.code = p.code; menu.style.cssText = 'top:52px;right:12px;min-width:220px';
  const add = (t, f, cls) => menu.append(el('button', { textContent: t, className: cls || '', onclick: () => { closeMenu(); f(); } }));
  add('Rename', () => { const v = (prompt('Rename this class:', p.name) || '').trim().slice(0, 40); if (v) { p.name = v; savePeriods(); renderClasses(); } });
  add('Remove class', () => {
    if (!confirm('Remove "' + p.name + '"? Its teams, class list and scores on this computer will be deleted.' + ((live[p.code] || {}).live ? '\n\nStudents currently in it will be sent back to the join screen.' : ''))) return;
    if ((live[p.code] || {}).live) hostSend(p.code, [{ t: 'reset' }]);
    removePeriod(p.code); renderClasses();
  }, 'danger');
  card.append(menu);
}
function addClass() {
  const name = (prompt('Name for the new class (for example 3rd Hour):') || '').trim(); if (!name) return;
  const c = newPeriod(name); renderClasses(); toast('Added "' + name + '". Code ' + c + '.');
}

function renderSets() {
  const box = $('#sets'); box.innerHTML = '';
  sets.forEach(s => {
    const c = el('div', { className: 'card setc' });
    const tile = el('div', { className: 'tile' }); tile.style.background = tileOf(s);
    const hd = el('div', { className: 'hd' }, tile, el('div', {}, el('div', { textContent: s.name, style: 'font-weight:700;font-size:17px;line-height:1.2' }), el('div', { className: 'mut', textContent: s.questions.length + ' question' + (s.questions.length === 1 ? '' : 's'), style: 'font-size:14px' })));
    const btns = el('div', { style: 'display:flex;gap:8px' }, el('a', { className: 'b', textContent: 'Edit', href: '/sets?id=' + s.id, style: 'flex:1;text-decoration:none' }), el('button', { className: 'b', textContent: 'Share link', style: 'flex:1', onclick: () => copyShareLink(s) }));
    c.append(hd, btns); box.append(c);
  });
}
async function renderShelf() {
  const box = $('#shelf'); box.textContent = '';
  try { await loadStarters(); } catch { box.textContent = 'Starter sets could not load. Check your connection.'; return; }
  const have = new Set(sets.map(s => s.name)), left = starters.filter(s => !have.has(s.name));
  $('#allst').textContent = 'See all ' + starters.length;
  if (!left.length) { box.append(el('div', { className: 'mut', textContent: 'You have added every starter set.' })); return; }
  left.slice(0, 3).forEach(st => {
    const tile = el('div', { className: 'tile' }); tile.style.background = tileOf({ id: st.id });
    const t = el('div', {}, tile, el('div', { style: 'flex:1;min-width:0' }, el('div', { textContent: st.name, style: 'font-weight:700' }), el('div', { className: 'mut', textContent: st.questions.length + ' questions · ' + st.subject, style: 'font-size:13px' })));
    const b = el('button', { className: 'b line2', textContent: 'Add' }); b.onclick = () => { addSet(st.name, st.questions); toast('Added "' + st.name + '".'); renderSets(); renderShelf(); };
    t.append(b); box.append(t);
  });
}
function renderBackup() {
  const stale = backupStale();
  $('#bk').classList.toggle('stale', stale);
  $('#bkt').textContent = stale ? 'Class lists live only on this computer' : 'Your work is backed up';
  $('#bkd').textContent = backupText() + '. A backup file lets you move to another computer.';
}

$('#newset').onclick = () => { const n = (prompt('Name for the new set (for example Fractions Unit 3):') || '').trim().slice(0, 60); if (!n) return; const s = addSet(n, []); location.href = '/sets?id=' + s.id + '&q=new'; };
$('#imp').onclick = () => $('#impfile').click();
$('#impfile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f && await importSetsFile(f)) { renderSets(); renderShelf(); } };
$('#allst').onclick = () => showStarters(() => { renderSets(); renderShelf(); });
$('#bkup').onclick = () => { doBackup(); renderBackup(); };
$('#rst').onclick = () => $('#restore').click();
$('#restore').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) doRestore(f, () => { renderClasses(); renderSets(); renderBackup(); }); };

// ask the server which classes are running (and how many students are in each)
const ask = () => periods.forEach(p => ws.send({ t: 'status', code: p.code }));
const ws = connect(m => { if (m.t === 'status') { live[m.code] = m; renderClasses(); } },
  () => { $('#conn').textContent = ''; ask(); },
  ok => { if (!ok) $('#conn').textContent = 'Connecting to the class server… it may be waking up, which can take up to a minute.'; });
setInterval(ask, 15000);

renderClasses(); renderBackup();
loadSets().then(() => { renderSets(); renderShelf(); checkShared(() => { renderSets(); renderShelf(); }); });
</script>
</body>
</html>
