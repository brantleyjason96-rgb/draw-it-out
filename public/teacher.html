<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out – Teacher</title>
<link rel="stylesheet" href="/style.css">
<style>
.code-pill{background:#111827;color:#fff;border-radius:12px;padding:6px 16px;font-size:28px;letter-spacing:.2em;font-weight:700;}
main{max-width:1600px!important}
.layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:12px;align-items:start;margin-top:12px}
#side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;padding:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
#cur{font-size:18px;padding:10px 16px;margin-bottom:12px}
#cur small{opacity:.75;display:block;font-size:13px}
#list li{cursor:default}
details>summary{cursor:pointer;color:var(--mut)}
@media(max-width:900px){.layout{grid-template-columns:1fr}#side{position:static;max-height:none}}
.stu{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.stu.spot{border-color:var(--pri);box-shadow:0 0 0 3px #bfdbfe}
.stu .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical}
#thumb{height:44px;width:auto;border-radius:6px;border:1px solid var(--line)}
.mut{color:var(--mut);font-size:14px}
#qin{min-height:64px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;overflow-wrap:anywhere}
#qin:empty:before{content:attr(data-ph);color:var(--mut)}
.sm{min-height:36px!important;padding:4px 12px!important}
</style>
</head>
<body>
<main>
 <div class="card">
  <div class="row" style="justify-content:space-between">
   <div class="row">
    <select id="persel" class="btn alt" aria-label="Class period"></select>
    <span class="mut">Code</span><span class="code-pill" id="code"></span>
    <span class="mut" id="count"></span>
    <span class="mut"><span class="dot" id="dot"></span><span id="st">Connecting…</span></span>
   </div>
   <div class="row">
    <button class="btn alt" id="hide"></button>
    <button class="btn alt" id="proj">Open projector view</button>
    <button class="btn alt" id="savepng">Save session (PNG)</button>
   </div>
  </div>
  <details style="margin-top:6px"><summary>Student link and class periods</summary>
   <div class="row mut" style="margin-top:8px">Student link for Google Classroom:
    <code id="link" style="background:#f3f4f6;padding:2px 6px;border-radius:6px"></code>
    <button class="btn alt" id="copy" style="min-height:32px;padding:4px 12px">Copy</button></div>
   <div class="row" style="margin-top:8px"><span class="mut">Class periods:</span>
    <button class="btn alt sm" id="newper">+ New period</button>
    <button class="btn alt sm" id="renper">Rename</button>
    <button class="btn alt sm" id="delper">Remove period</button>
    <button class="btn alt sm" id="clearcls">Clear class (send students back to join)</button></div>
  </details>
 </div>

 <div class="layout">
  <aside id="side" class="card">
   <div id="bar" class="row" style="background:#111827;color:#fff;border-radius:12px;padding:8px 10px;justify-content:space-between;margin-bottom:10px">
    <button class="btn alt sm" id="prev" aria-label="Previous question">◀</button>
    <b id="pos" style="text-align:center"></b>
    <button class="btn sm" id="next" aria-label="Next question">▶</button>
   </div>
   <details open id="qdet"><summary><b style="color:var(--ink)">Question set</b></summary>
    <div class="row" style="margin-top:8px">
     <select id="setsel" class="btn alt sm" style="flex:1;min-width:0" aria-label="Choose a saved set"></select>
     <button class="btn alt sm" id="add">+ Add</button>
    </div>
    <details style="margin-top:6px"><summary>Manage sets</summary>
     <div class="row" style="margin-top:6px">
      <button class="btn alt sm" id="newset">New set</button>
      <button class="btn alt sm" id="renset">Rename</button>
      <button class="btn alt sm" id="delset">Delete set</button>
      <button class="btn alt sm" id="exp" title="Download all your sets as a file (backup, or move to another computer)">Export</button>
      <button class="btn alt sm" id="imp">Import</button>
      <input type="file" id="impfile" accept=".json,application/json" hidden>
     </div>
    </details>
    <ol id="list" style="padding-left:22px;margin:10px 0 0"></ol>
    <div id="editor" hidden style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
     <div class="row" style="margin-bottom:6px">
      <button class="btn alt sm fmt" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="btn alt sm fmt" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="btn alt sm fmt" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
     </div>
     <div id="qin" contenteditable="true" role="textbox" aria-label="Question" data-ph="Type the question students should answer…"></div>
     <div class="row" style="margin-top:8px">
      <select id="bg" class="btn alt sm" aria-label="Background">
       <option value="graph">Graph paper</option><option value="lined">Lined</option><option value="blank">Blank</option><option value="photo">Photo</option>
      </select>
      <button class="btn alt sm" id="addimg">Add photo</button>
      <input type="file" id="file" accept="image/*" hidden>
      <img id="thumb" alt="Photo preview" hidden>
      <button class="btn alt sm" id="rmimg" hidden>Remove photo</button>
     </div>
     <div class="row" style="margin-top:8px">
      <button class="btn alt sm" id="cancel">Cancel</button>
      <button class="btn alt sm" id="sendnow">Send now (don't save)</button>
      <button class="btn sm" id="save">Save question</button>
     </div>
     <div class="mut" style="margin-top:6px">Tip: paste a photo or screenshot (Ctrl+V) to attach it.</div>
    </div>
   </details>
  </aside>

  <section>
   <div class="qbar" id="cur"></div>
   <div id="grid"></div>
  </section>
 </div>
</main>
<script src="/common.js"></script>
<script>
const CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd = () => Array.from({ length: 4 }, () => CH[Math.random() * 32 | 0]).join('');
let periods; try { periods = JSON.parse(localStorage.do_periods); } catch {}
if (!Array.isArray(periods) || !periods.length) periods = [{ name: 'My class', code: localStorage.do_tcode || rnd() }];
let code = (periods.find(p => p.code === localStorage.do_tcode) || periods[0]).code;
let key = localStorage.do_tkey; if (!key) localStorage.do_tkey = key = crypto.randomUUID();
const savePeriods = () => { localStorage.do_periods = JSON.stringify(periods); localStorage.do_tcode = code; };
savePeriods();
$('#code').textContent = code;
const per = () => periods.find(p => p.code === code);
$('#persel').innerHTML = ''; periods.forEach(p => { const o = document.createElement('option'); o.value = p.code; o.textContent = p.name; $('#persel').append(o); });
$('#persel').value = code;
$('#persel').onchange = e => { code = e.target.value; savePeriods(); location.reload(); };
$('#newper').onclick = () => {
  const name = (prompt('Name for the new class period (e.g. Hour 2):') || '').trim().slice(0, 40); if (!name) return;
  let c; do c = rnd(); while (periods.some(p => p.code === c));
  periods.push({ name, code: c }); code = c; savePeriods(); location.reload();
};
$('#renper').onclick = () => {
  const name = (prompt('Rename this class period:', per().name) || '').trim().slice(0, 40); if (!name) return;
  per().name = name; savePeriods(); location.reload();
};
$('#delper').onclick = () => {
  if (periods.length < 2) return alert('You need at least one class period.');
  if (!confirm('Remove the class period "' + per().name + '"? Its students and their work will be lost.')) return;
  ws.send({ t: 'reset' }); periods = periods.filter(p => p.code !== code); code = periods[0].code; savePeriods(); setTimeout(() => location.reload(), 300);
};
$('#clearcls').onclick = () => {
  if (confirm('Remove all students from "' + per().name + '"? Save the session PNG first if you want to keep their work.')) ws.send({ t: 'reset' });
};
const link = location.origin + '/?code=' + code;
$('#link').textContent = link;

const S = { q: { question: '', bg: 'graph', img: null }, im: null, spot: null, hide: true, stu: new Map() };
let photo = null; // photo = data URL waiting to be saved/sent

const ws = connect(onmsg, () => ws.send({ t: 'host', code, key }), ok => {
  $('#dot').classList.toggle('ok', ok); $('#st').textContent = ok ? 'Connected' : 'Reconnecting…';
});

function addStu(d) {
  let s = S.stu.get(d.id);
  if (!s) {
    s = { id: d.id, layer: mkLayer(), dirty: true };
    const el = document.createElement('div'); el.className = 'stu';
    el.innerHTML = '<div class="top"><span class="nm"></span><span class="chip"></span></div><canvas width="800" height="500"></canvas>';
    el.onclick = () => ws.send({ t: 'spot', id: S.spot === s.id ? null : s.id, hide: S.hide });
    $('#grid').append(el); s.el = el; s.cv = el.querySelector('canvas'); S.stu.set(d.id, s);
  }
  Object.assign(s, { name: d.name, objs: d.objs, dirty: true }); ui();
}
function setQ(q) {
  S.q = q; S.im = loadImg(q.img, () => S.stu.forEach(s => (s.dirty = true)));
  S.stu.forEach(s => (s.dirty = true));
}

function onmsg(m) {
  const s = S.stu.get(m.id);
  switch (m.t) {
    case 'err':
      $('#st').textContent = m.m;
      if (/in use/.test(m.m)) { per().code = rnd(); code = per().code; savePeriods(); location.reload(); } // another teacher already has that code
      break;
    case 'state':
      $('#grid').innerHTML = ''; S.stu.clear(); S.spot = m.spot; S.hide = m.hide; setQ(m.q);
      m.students.forEach(addStu);
      ui(); break;
    case 'join': addStu(m.s); break;
    case 'set': if (s) { const i = s.objs.findIndex(o => o.id === m.o.id); if (i >= 0) s.objs[i] = m.o; else s.objs.push(m.o); s.dirty = true; } break;
    case 'pts': if (s) { const o = s.objs.find(o => o.id === m.oid); if (o) { o.pts.push(...m.p); s.dirty = true; } } break;
    case 'del': if (s) { s.objs = s.objs.filter(o => o.id !== m.oid); s.dirty = true; } break;
    case 'all': if (s) { s.objs = m.objs; s.dirty = true; } break;
    case 'q': setQ(m.q); S.stu.forEach(x => { x.objs = []; x.dirty = true; }); ui(); break;
    case 'spot': S.spot = m.spot; S.hide = m.hide; ui(); break;
  }
}

function ui() {
  $('#count').textContent = S.stu.size + ' student' + (S.stu.size === 1 ? '' : 's') + ' joined';
  $('#cur').innerHTML = '<small>Students are answering</small>' + (S.q.question || (S.q.img ? '(picture)' : 'Nothing sent yet — pick a question on the left')); // server-sanitized: only b/i/u/br
  $('#hide').textContent = S.hide ? 'Names hidden on projector' : 'Names shown on projector';
  $('#hide').classList.toggle('on', S.hide);
  S.stu.forEach(s => {
    s.el.querySelector('.nm').textContent = s.name;
    const c = s.el.querySelector('.chip'); c.textContent = S.spot === s.id ? 'Projected' : ''; c.hidden = S.spot !== s.id;
    s.el.classList.toggle('spot', S.spot === s.id);
  });
}
(function loop() {
  S.stu.forEach(s => { if (s.dirty) { s.dirty = false; replay(s.layer, s.objs); compose(s.cv, s.layer, S.q.bg, S.im); } });
  requestAnimationFrame(loop);
})();

// controls
$('#hide').onclick = () => ws.send({ t: 'spot', id: S.spot, hide: !S.hide });
$('#proj').onclick = () => window.open('/projector?code=' + code, 'projector');
$('#copy').onclick = () => navigator.clipboard.writeText(link).then(() => ($('#copy').textContent = 'Copied ✓'), () => prompt('Copy this link:', link));
// ---- saved question sets: kept in this browser (IndexedDB). Export/Import moves them between computers. ----
let sets = [], active = localStorage.do_active, cur = +localStorage.do_cur, editing = null; // editing: null closed, -1 new, n = index
const cs = () => sets.find(s => s.id === active) || sets[0];
const qs = () => cs().questions;
const db = new Promise((ok, no) => { const o = indexedDB.open('doi', 1); o.onupgradeneeded = () => o.result.createObjectStore('k'); o.onsuccess = () => ok(o.result); o.onerror = no; });
const idbGet = k => db.then(d => new Promise(r => { const q = d.transaction('k').objectStore('k').get(k); q.onsuccess = () => r(q.result); }));
const persist = () => db.then(d => d.transaction('k', 'readwrite').objectStore('k').put(sets, 'sets')).catch(() => alert('Could not save in this browser. Use Export to keep a backup.'));
function init(s, old) { // old = the single question list from the first version, kept as a set
  sets = s && s.length ? s : [{ id: crypto.randomUUID(), name: old ? 'My questions' : 'My first set', questions: old || [] }];
  if (!sets.some(x => x.id === active)) active = sets[0].id;
  if (!(cur >= 0 && cur < qs().length)) cur = -1;
  persist(); renderSet();
}
Promise.all([idbGet('sets'), idbGet('set')]).then(([s, old]) => init(s, old)).catch(() => init());

// formatted text: keep only b/i/u/br (the server does the same to anything it receives)
function clean(html) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const walk = n => {
    let o = '';
    n.childNodes.forEach((c, i, a) => {
      if (c.nodeType === 3) o += esc(c.textContent);
      else if (c.nodeType === 1) {
        const tg = c.tagName, inner = walk(c);
        if (tg === 'B' || tg === 'STRONG') o += '<b>' + inner + '</b>';
        else if (tg === 'I' || tg === 'EM') o += '<i>' + inner + '</i>';
        else if (tg === 'U') o += '<u>' + inner + '</u>';
        else if (tg === 'BR') o += '<br>';
        else if (tg === 'DIV' || tg === 'P') { if (o && !o.endsWith('<br>')) o += '<br>'; o += inner; if (i < a.length - 1 && !inner.endsWith('<br>')) o += '<br>'; }
        else if (tg !== 'SCRIPT' && tg !== 'STYLE') o += inner;
      }
    });
    return o;
  };
  return walk(new DOMParser().parseFromString(html, 'text/html').body).replace(/(<br>)+$/, '');
}
const plain = h => new DOMParser().parseFromString(h.replace(/<br>/g, ' '), 'text/html').body.textContent;
document.querySelectorAll('[data-cmd]').forEach(b => {
  b.onmousedown = e => e.preventDefault(); // keep the text selected
  b.onclick = () => document.execCommand(b.dataset.cmd);
});
$('#qin').addEventListener('paste', e => { // text pastes as plain text; images are handled by the page-level paste below
  if ([...e.clipboardData.files].some(f => f.type.startsWith('image/'))) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});

if (innerWidth < 900) $('#qdet').open = false; // small screens: students first, questions on demand
const sendQ = q => ws.send({ t: 'q', question: q.question, bg: q.bg, img: q.bg === 'photo' ? q.img : null });
function go(i) { if (i < 0 || i >= qs().length) return; cur = i; localStorage.do_cur = i; sendQ(qs()[i]); renderSet(); }
function renderSet() {
  const sel = $('#setsel'); sel.innerHTML = '';
  sets.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name + ' (' + s.questions.length + ')'; sel.append(o); });
  sel.value = cs().id;
  const ol = $('#list'); ol.innerHTML = '';
  qs().forEach((q, i) => {
    const li = document.createElement('li'); li.style.cssText = 'margin:6px 0;padding:8px;border:2px solid ' + (i === cur ? 'var(--pri)' : 'var(--line)') + ';border-radius:10px';
    const top = document.createElement('div'); top.style.cssText = 'display:flex;gap:8px;align-items:center';
    if (q.img) { const im = document.createElement('img'); im.src = q.img; im.style.cssText = 'height:40px;border-radius:6px;flex:none'; top.append(im); }
    const tx = document.createElement('span'); tx.style.cssText = 'flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden'; tx.textContent = plain(q.question).trim() || '(photo only)'; top.append(tx);
    const row = document.createElement('div'); row.className = 'row'; row.style.marginTop = '6px';
    [['Send', () => go(i)], ['↑', () => mv(i, -1)], ['↓', () => mv(i, 1)], ['Edit', () => openEditor(i)], ['✕', () => rm(i)]].forEach(([l, f]) => {
      const b = document.createElement('button'); b.className = 'btn alt sm'; b.textContent = l; b.onclick = f; row.append(b);
    });
    li.append(top);
    li.append(row); ol.append(li);
  });
  const n = qs().length;
  $('#pos').textContent = !n ? 'No questions yet' : cur < 0 ? n + ' questions · none sent yet' : 'Question ' + (cur + 1) + ' of ' + n;
  $('#prev').disabled = cur <= 0; $('#next').disabled = !n || cur >= n - 1;
}
function mv(i, d) {
  const j = i + d, a = qs(); if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; if (cur === i) cur = j; else if (cur === j) cur = i;
  localStorage.do_cur = cur; persist(); renderSet();
}
function rm(i) {
  if (!confirm('Delete this question?')) return;
  qs().splice(i, 1); if (i < cur) cur--; else if (i === cur) cur = -1;
  localStorage.do_cur = cur; persist(); renderSet();
}
function pick(id) { active = id; localStorage.do_active = id; cur = -1; localStorage.do_cur = -1; closeEditor(); renderSet(); }
$('#setsel').onchange = e => pick(e.target.value);
$('#newset').onclick = () => {
  const name = (prompt('Name for the new set (e.g. Fractions Unit 3):') || '').trim().slice(0, 60); if (!name) return;
  const s = { id: crypto.randomUUID(), name, questions: [] }; sets.push(s); persist(); pick(s.id);
};
$('#renset').onclick = () => {
  const name = (prompt('Rename this set:', cs().name) || '').trim().slice(0, 60); if (!name) return;
  cs().name = name; persist(); renderSet();
};
$('#delset').onclick = () => {
  if (!confirm('Delete the set "' + cs().name + '" and all ' + qs().length + ' of its questions? This cannot be undone.')) return;
  sets = sets.filter(s => s !== cs());
  if (!sets.length) sets = [{ id: crypto.randomUUID(), name: 'My first set', questions: [] }];
  persist(); pick(sets[0].id);
};
$('#exp').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(sets)], { type: 'application/json' }));
  a.download = 'draw-it-out-question-sets.json'; a.click();
};
$('#imp').onclick = () => $('#impfile').click();
$('#impfile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); let n = 0;
    (Array.isArray(data) ? data : []).forEach(s => {
      if (!s || !Array.isArray(s.questions)) return;
      sets.push({ id: crypto.randomUUID(), name: String(s.name || 'Imported set').slice(0, 60), questions: s.questions.slice(0, 200).map(q => {
        const img = typeof q.img === 'string' && q.img.startsWith('data:image/jpeg;base64,') ? q.img : null;
        const bg = ['graph', 'lined', 'blank', 'photo'].includes(q.bg) && (q.bg !== 'photo' || img) ? q.bg : 'blank';
        return { question: clean(String(q.question || '')), bg, img };
      }) }); n++;
    });
    if (!n) throw 0;
    persist(); pick(sets[sets.length - 1].id); alert('Imported ' + n + ' set' + (n === 1 ? '' : 's') + '.');
  } catch { alert('That file is not a Draw It Out question set.'); }
};

function openEditor(i) {
  editing = i; const q = qs()[i] || { question: '', bg: 'graph', img: null };
  $('#qin').innerHTML = clean(q.question); $('#bg').value = q.bg; photo = q.img;
  $('#thumb').hidden = $('#rmimg').hidden = !photo; if (photo) $('#thumb').src = photo;
  $('#editor').hidden = false; $('#qin').focus();
}
const readEditor = () => {
  const bg = $('#bg').value === 'photo' && !photo ? 'blank' : $('#bg').value;
  return { question: clean($('#qin').innerHTML), bg, img: bg === 'photo' ? photo : null };
};
const closeEditor = () => { editing = null; $('#editor').hidden = true; };
$('#add').onclick = () => openEditor(-1);
$('#cancel').onclick = closeEditor;
$('#save').onclick = () => {
  const q = readEditor(); if (!plain(q.question).trim() && !q.img) return alert('Type a question or add a photo first.');
  if (editing === -1) qs().push(q); else qs()[editing] = q;
  persist(); closeEditor(); renderSet();
};
$('#sendnow').onclick = () => { const q = readEditor(); if (plain(q.question).trim() || q.img) { cur = -1; localStorage.do_cur = -1; sendQ(q); renderSet(); } };
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
// clicker / keyboard: right arrow or Page Down = next, left arrow or Page Up = previous
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
});

// photos: resized to <=1600px JPEG so Chromebooks stay fast
function takePhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const u = URL.createObjectURL(file), i = new Image();
  i.onload = () => {
    const s = Math.min(1, 1600 / Math.max(i.width, i.height)), c = document.createElement('canvas');
    c.width = Math.round(i.width * s); c.height = Math.round(i.height * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0, c.width, c.height);
    photo = c.toDataURL('image/jpeg', 0.82); URL.revokeObjectURL(u);
    $('#thumb').src = photo; $('#thumb').hidden = $('#rmimg').hidden = false; $('#bg').value = 'photo';
  };
  i.src = u;
}
$('#addimg').onclick = () => $('#file').click();
$('#file').onchange = e => { takePhoto(e.target.files[0]); e.target.value = ''; };
$('#rmimg').onclick = () => { photo = null; $('#thumb').hidden = $('#rmimg').hidden = true; if ($('#bg').value === 'photo') $('#bg').value = 'graph'; };
document.addEventListener('paste', e => { const f = [...e.clipboardData.files].find(f => f.type.startsWith('image/')); if (f) { if (editing === null) openEditor(-1); takePhoto(f); } });

// save a contact sheet of everyone's work
$('#savepng').onclick = () => {
  const list = [...S.stu.values()], cols = 4, w = W / 2, h = H / 2 + 30;
  const c = document.createElement('canvas'); c.width = cols * w; c.height = Math.max(1, Math.ceil(list.length / cols)) * h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  list.forEach((s, i) => {
    replay(s.layer, s.objs); const t = document.createElement('canvas'); t.width = W; t.height = H; compose(t, s.layer, S.q.bg, S.im);
    const px = i % cols * w, py = Math.floor(i / cols) * h;
    x.drawImage(t, px, py + 30, w, H / 2); x.fillStyle = '#000'; x.font = '20px sans-serif'; x.fillText(s.name, px + 8, py + 22);
  });
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'draw-it-out-' + code + '.png'; a.click(); });
};
</script>
