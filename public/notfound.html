<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--c-bg);color:var(--c-ink);font:var(--fs-md) / 1.5 var(--font-body)}
main{max-width:460px;text-align:center}

.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

<main>
 <h1>That page is not here</h1>
