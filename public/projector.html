<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out – Projector</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/sortkit.css">
<style>
body{background:var(--c-stage);color:#fff;display:flex;flex-direction:column;height:100vh;height:100dvh;--fh:max(56px,7.2vh)}
.qbar{background:transparent;font-size:clamp(34px,min(3vw,5vh),54px);line-height:1.25;text-align:center}
#join{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(24px,6vw,110px);text-align:center;margin:auto;padding-bottom:2vh;font-size:clamp(24px,3vw,40px)}
#qr{width:clamp(200px,min(26vw,46vh),440px);height:clamp(200px,min(26vw,46vh),440px);background:#fff;border-radius:var(--r-lg);padding:6px}
.jcap{font-size:clamp(22px,2vw,32px);margin-top:10px;color:var(--c-stage-accent)}
body:has(#join:not([hidden])) .qbar{font-size:clamp(34px,min(3.6vw,6vh),64px)}
#join b{font-size:clamp(64px,10vw,150px);letter-spacing:.2em;display:block;color:var(--c-stage-accent)}
#who{text-align:center;font-size:clamp(24px,2.4vw,36px);margin-top:10px;color:var(--c-stage-accent)}
main{max-width:none;display:flex;flex-direction:column;flex:1;min-height:0;width:100%;padding:12px 4vw 8px;margin:0}
canvas{border:0}
/* leaderboard: one bar per team in its colour, length = points. Text sits on dark plates, so it reads on every team colour. */
#lb{flex:1;min-height:0;position:relative;margin-top:.4vh}
.lr{position:absolute;left:0;right:0;height:calc(100% / var(--n) - 1.4vh);top:calc(var(--i) * 100% / var(--n));display:flex;align-items:center;border-radius:14px;background:var(--c-stage-2);overflow:hidden;transition:top .7s cubic-bezier(.2,.9,.3,1)}
.lr .fill{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--tc);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.lr .in{position:relative;z-index:1;display:flex;align-items:center;width:100%;gap:1.4vw;padding:0 1.2vw}
.lr .sp{flex:1}
.plate{display:flex;align-items:center;gap:.7em;background:rgba(11,18,32,.92);color:#fff;border-radius:99px;padding:0 1.1em;height:78%;font-weight:800;font-size:clamp(34px,5.6vh,60px);line-height:1;white-space:nowrap;min-width:0}
.plate .rk{display:grid;place-items:center;flex:none;width:1.25em;height:1.25em;border-radius:50%;background:#fff;color:var(--c-stage);font-size:.8em}
.plate .tn{overflow:hidden;text-overflow:ellipsis}
.plate.sc{font-family:var(--font-display);font-size:clamp(34px,6.4vh,68px);padding:0 .9em;font-variant-numeric:tabular-nums}
.plate .crown{display:inline-flex;flex:none}
.plate .crown svg{width:1em;height:1em;fill:none;stroke:var(--c-warn-on-dark);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lb.even .lr .fill{width:100%;opacity:.28}
.lr.pop .sc{animation:pop .9s}
@keyframes pop{30%{transform:scale(1.25);color:var(--c-note)}}
#lbnote{flex:none;text-align:center;font-size:clamp(28px,4vh,46px);font-weight:700;color:var(--c-stage-accent);padding:1.2vh 0 0}
/* sort questions: one student's lanes, or the whole class's results */
#sb{display:grid;gap:14px;margin-top:10px}
#sb .slane{background:#fff;color:var(--c-ink);border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:300px}
#sb .slane h3{margin:0;font-size:30px;text-align:center}
#sb .nc{font-size:26px;padding:12px 14px;cursor:default}
#sm{flex:1;min-height:0;display:flex}
/* class results: one neutral colour, no red or green on the screen the class is looking at */
.res{flex:1;min-height:0;display:grid;gap:3vw}
.res>div{display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.res h2{margin:0;font-size:clamp(30px,4.6vh,52px);font-weight:800;color:var(--c-stage-accent)}
.rbar .t{display:flex;align-items:center;gap:.5em;font-size:clamp(26px,4.2vh,46px);font-weight:600;margin-bottom:.35vh}
.rbar .t .ok{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--c-stage-accent);color:var(--c-stage);flex:none}
.rbar .t .ok svg{width:.9em;height:.9em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rbar .trk{display:flex;align-items:center;gap:1vw}
.rbar .b{flex:1;height:3.8vh;min-height:20px;border-radius:99px;background:var(--c-stage-3);overflow:hidden}
.rbar .b i{display:block;height:100%;background:var(--c-stage-accent);border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.rbar.best .b i{background:#fff}
.rbar .pct{width:3.2em;text-align:right;font-weight:800;font-size:clamp(32px,5.4vh,60px);font-variant-numeric:tabular-nums}
/* one drawing, or two or three: tiles fill the height under the question, each name is a label attached to its tile.
   Three drawings sit two over one, because student pages are wide and a third column would leave most of each tile empty. */
#boards{display:grid;gap:1.6vw;margin-top:4px;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
#boards.three{grid-template-rows:repeat(2,minmax(0,1fr))}
#boards .bp{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--c-stage-2);border:2px solid var(--c-stage-3);border-radius:14px;overflow:hidden}
#boards .bp.c3{grid-column:1/-1;justify-self:center;width:calc(50% - .8vw)}
#boards .bph{flex:none;display:flex;align-items:center;gap:.6em;padding:.4em .8em;background:var(--c-stage-3);font-size:clamp(20px,2.7vh,30px);color:#fff}
#boards .bph b{font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#boards .bph .pchip{margin-left:auto;font-size:.82em}
#boards .bpc{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--c-stage-3)}
#boards canvas{display:block;border:0;border-radius:var(--r-xs);background:var(--c-canvas-gap)}
.pchip{font-size:clamp(18px,1.8vw,28px);font-weight:700;border-radius:var(--r-pill);padding:2px 10px;white-space:nowrap}
/* the footer is on every view: logo left, how to join right. The question keeps the full width. */
#foot{flex:none;position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:0 3vw;height:var(--fh);background:var(--c-stage-2);border-top:1px solid var(--c-stage-3);font-size:clamp(20px,2.7vh,30px)}
#foot .logo{display:flex;align-items:center;gap:1vw;font-family:var(--font-display);font-weight:700;color:#fff}
#foot .logo svg{height:1.5em;width:1.5em;flex:none}
#ftimer{display:flex;align-items:baseline;gap:.5em;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
#ftimer[hidden]{display:none}
#fdig{font-family:var(--font-display);font-size:calc(var(--fh) * .8);line-height:1}
#fw{color:var(--c-stage-accent)}
#ftimer.low #fdig,#tbig.low #tbd{color:var(--c-warn-on-dark)}
#ftimer.up #fdig,#tbig.up #tbd{color:var(--c-bad-on-dark)}
#chime{display:inline-flex;align-items:center;gap:.4em;background:none;border:2px solid var(--c-stage-3);border-radius:99px;color:var(--c-stage-mut);font:inherit;font-size:.7em;padding:.2em .8em;cursor:pointer;opacity:0;transition:opacity .2s}
#foot:hover #chime,#chime:focus-visible,#chime[aria-pressed=true]{opacity:.85}
#chime svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tbig{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#tbig[hidden]{display:none}
#tbd{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:min(34vh,26vw);line-height:1;color:#fff}
#tbw{font-size:clamp(28px,5vh,60px);font-weight:800;color:var(--c-stage-accent);min-height:1.2em;margin-top:1vh}
#tbig.low #tbw{color:var(--c-warn-on-dark)}
#tbig.up #tbw{color:var(--c-bad-on-dark)}
#foot .joinline{color:var(--c-stage-mut)}
#foot .site{color:var(--c-stage-ink);font-weight:600}
#foot b{color:#fff;font-weight:800;letter-spacing:.14em;margin-left:.3em;font-size:1.12em}
/* frozen: the teacher has the floor */
#frz{position:fixed;inset:0 0 var(--fh) 0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:var(--c-frost);color:var(--c-frost-soft)}
body.frozen #frz{display:flex}
body.frozen main{filter:blur(3px) saturate(.6);opacity:.35}
#frz .fi{font-size:92px;line-height:1;animation:fzwave 2.6s ease-in-out infinite}
#frz b{font-size:64px;line-height:1.1;margin:8px 0 4px}
#frz p{font-size:28px;margin:0;color:var(--c-stage-accent)}
#frzflakes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#frzflakes i{position:absolute;top:-10vh;font-style:normal;color:var(--c-frost-soft);opacity:.5;animation:snofall linear infinite}
@keyframes snofall{to{transform:translateY(120vh) rotate(360deg)}}
@keyframes fzwave{0%,68%,100%{transform:rotate(0)}76%{transform:rotate(13deg)}84%{transform:rotate(-9deg)}}
@media(prefers-reduced-motion:reduce){#frz .fi{animation:none}#frzflakes{display:none}}
</style>
</head>
<body>
<main>
 <div class="qbar" id="q"></div>
 <div id="lb" hidden></div>
 <div id="lbnote" hidden>First point wins the lead</div>
 <div id="sb" hidden></div>
 <div id="sm" hidden></div>
 <div id="boards" hidden></div>
 <div id="tbig" role="timer" aria-label="Time left" hidden><div id="tbd"></div><div id="tbw"></div></div>
 <div id="join"><div class="jl">Go to <span id="url"></span><b id="code"></b></div><div class="jr"><div id="qr" role="img" aria-label="QR code to join"></div><div class="jcap">or scan to join</div></div></div>
 <div id="who"></div>
</main>
<div id="foot"><div class="logo"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1e3a8a"/><path d="M9 22.5c3-8 6-11 9-9s-1 7 5 2.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.4" fill="#fbbf24"/></svg>Draw It Out</div><div id="ftimer" role="timer" aria-label="Time left" hidden><span id="fdig"></span><span id="fw"></span></div><div class="joinline">Join at <span class="site" id="fsite"></span> · code <b id="fcode"></b></div><button type="button" id="chime" aria-pressed="false" title="Play a soft chime when time is up (this screen only)"><svg data-i="bell"></svg><span>Chime off</span></button></div>
<div id="frz" role="alertdialog" aria-label="Class frozen">
 <div id="frzflakes" aria-hidden="true"></div>
 <span class="fi" aria-hidden="true">✋</span><b>Class frozen</b><p>Look at your teacher.</p>
</div>
<script src="/qrcode.js"></script>
<script src="/icons.js"></script>
<script src="/common.js"></script>
<script src="/sortkit.js"></script>
<script src="/timerkit.js"></script>
<script>
const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
$('#url').textContent = location.host; $('#code').textContent = code;
try { $('#qr').innerHTML = qrSvg(location.origin + '/?code=' + code); } catch (e) { $('#qr').hidden = true; }
const S = { q: { question: '', bg: 'graph', img: null }, im: null, spot: null, picks: [], hide: true, board: false, frozen: false, teams: [], scores: {}, sres: false, sum: null, stu: new Map() };
$('#fsite').textContent = location.host; $('#fcode').textContent = code;
const ws = connect(onmsg, () => ws.send({ t: 'watch', code }), ok => { if (!ok) $('#who').textContent = 'Reconnecting…'; });

function setQ(q) { S.q = q; S.im = loadImg(q.img, draw); }
function onmsg(m) {
  const s = S.stu.get(m.id);
  switch (m.t) {
    case 'err': $('#who').textContent = m.m; setTimeout(() => ws.send({ t: 'watch', code }), 3000); return;
    case 'state': S.stu.clear(); S.picks = m.picks || (m.spot ? [m.spot] : []); S.spot = S.picks[0] || null; S.hide = m.hide; S.board = !!m.board; S.teams = m.teams || []; S.scores = m.scores || {}; S.frozen = !!m.frozen; setQ(m.q);
      m.students.forEach(d => S.stu.set(d.id, { name: d.name, objs: d.objs, bw: d.bw, bh: d.bh, sort: d.sort || {}, pl: d.pl || {}, pulse: d.pulse || null, d: true })); S.sres = !!m.sres; S.sum = null; TK.set(m.timer); if (S.frozen) makeFlakes(); break;
    case 'join': S.stu.set(m.s.id, { name: m.s.name, objs: m.s.objs, bw: m.s.bw, bh: m.s.bh, sort: m.s.sort || {}, pl: m.s.pl || {}, pulse: m.s.pulse || null, d: true }); break;
    case 'set': if (s) { const i = s.objs.findIndex(o => o.id === m.o.id); if (i >= 0) s.objs[i] = m.o; else s.objs.push(m.o); s.d = true; } break;
    case 'pts': if (s) { const o = s.objs.find(o => o.id === m.oid); if (o) { o.pts.push(...m.p); s.d = true; } } break;
    case 'del': if (s) { s.objs = s.objs.filter(o => o.id !== m.oid); s.d = true; } break;
    case 'all': if (s) { s.objs = m.objs; s.d = true; } break;
    case 'pl': if (s) { s.pl = m.p || {}; s.d = true; } break; // a student moved a piece
    case 'restore': setQ(m.q); break;
    case 'q': setQ(m.q); S.sum = null; S.stu.forEach(x => { x.objs = []; x.sort = {}; x.pl = {}; x.d = true; }); break;
    case 'sort': if (s) s.sort = m.p; break;
    case 'sres': S.sres = m.on; break;
    case 'sum': S.sum = m; break;
    case 'spot': S.picks = m.picks || (m.spot ? [m.spot] : []); S.spot = S.picks[0] || null; S.hide = m.hide; break;
    case 'pulse': if (s) s.pulse = m.c; break;
    case 'timer': TK.handle(m); break;
    case 'freeze': S.frozen = m.on; if (m.on) makeFlakes(); break;
    case 'score': S.teams = m.teams; S.scores = m.scores; break;
    case 'board': S.board = m.on; break;
    case 'gone': S.stu.delete(m.id); S.picks = S.picks.filter(id => id !== m.id); break;
  }
  draw();
}
// frost falling on the frozen screen (drawn once, reused)
const FLAKES = '❄✳❅✻❆';
function makeFlakes() {
  const box = $('#frzflakes'); if (box.childElementCount) return;
  for (let i = 0; i < 30; i++) {
    const f = document.createElement('i'); f.textContent = FLAKES[i % FLAKES.length];
    f.style.left = Math.random() * 100 + '%';
    f.style.fontSize = 12 + Math.random() * 26 + 'px';
    f.style.animationDuration = 7 + Math.random() * 9 + 's';
    f.style.animationDelay = -Math.random() * 9 + 's';
    box.append(f);
  }
}
// leaderboard: one persistent row per team so bars slide and rows reorder smoothly
const rows = new Map(); let prev = {};
const CROWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>';
function board() {
  const box = $('#lb'), ranked = rankTeams(S.teams, S.scores), max = scoreMax(ranked), zero = ranked.every(x => !x.score);
  const here = new Set(ranked.map(x => x.team.id));
  rows.forEach((r, id) => { if (!here.has(id)) { r.el.remove(); rows.delete(id); } });
  box.style.setProperty('--n', ranked.length); box.classList.toggle('even', zero); $('#lbnote').hidden = !zero;
  ranked.forEach((x, i) => {
    const t = x.team;
    let r = rows.get(t.id);
    if (!r) { const el = document.createElement('div'); el.className = 'lr'; el.innerHTML = '<div class="fill"></div><div class="in"><div class="plate"><span class="rk"></span><span class="tn"></span><span class="crown" hidden>' + CROWN + '</span></div><span class="sp"></span><div class="plate sc"></div></div>'; box.append(el); r = { el }; rows.set(t.id, r); }
    r.el.style.setProperty('--i', i); r.el.style.setProperty('--tc', t.color);
    r.el.style.setProperty('--w', zero ? '100%' : Math.max(x.score ? 18 : 0, Math.round(x.score / max * 100)) + '%');
    r.el.querySelector('.rk').textContent = x.rank;
    r.el.querySelector('.tn').textContent = teamLabel(t);
    r.el.querySelector('.crown').hidden = !x.leader;
    r.el.querySelector('.sc').textContent = x.score;
    if (prev[t.id] !== undefined && x.score > prev[t.id]) { r.el.classList.remove('pop'); void r.el.offsetWidth; r.el.classList.add('pop'); }
    prev[t.id] = x.score;
  });
}
// one student's sort: their lanes with their sticky notes (the projector never gets the answer key, so no right or wrong here)
function sortBoard(s) {
  const sq = S.q.sort, box = $('#sb'); box.textContent = ''; box.style.gridTemplateColumns = 'repeat(' + sq.lanes.length + ',minmax(0,1fr))';
  sq.lanes.forEach(l => {
    const d = document.createElement('div'); d.className = 'slane'; const h = document.createElement('h3'); h.textContent = l.name; d.append(h);
    sq.cards.filter(c => s.sort[c.id] === l.id).forEach(c => d.append(SK.note(c)));
    box.append(d);
  });
  const left = sq.cards.filter(c => !s.sort[c.id]).length;
  return left ? left + ' card' + (left === 1 ? '' : 's') + ' still to place' : '';
}
// the whole class: which ideas are working, and the cards to look at again
function sortSummary() {
  const box = $('#sm'), m = S.sum; box.textContent = '';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const bar = (name, pct, best) => {
    const r = document.createElement('div'); r.className = 'rbar' + (best ? ' best' : '');
    r.innerHTML = '<div class="t">' + (best ? '<span class="ok" title="Best understood">' + CHECK + '</span>' : '') + '<span class="tx"></span></div><div class="trk"><div class="b"><i></i></div><span class="pct"></span></div>';
    r.querySelector('.tx').textContent = name; r.querySelector('i').style.width = Math.max(2, pct) + '%'; r.querySelector('.pct').textContent = pct + '%'; return r;
  };
  const col = (title, bars) => { const d = document.createElement('div'), h = document.createElement('h2'); h.textContent = title; d.append(h, ...bars); return d; };
  const ideas = m.ideas.filter(i => i.pct != null).sort((a, b) => b.pct - a.pct);
  const res = document.createElement('div'); res.className = 'res'; res.style.gridTemplateColumns = ideas.length ? '1fr 1fr' : '1fr';
  if (ideas.length) res.append(col('Which ideas are working?', ideas.map((i, k) => bar(i.name, i.pct, k === 0))));
  res.append(col('Let’s look at these again', m.cards.slice().sort((a, b) => a.pct - b.pct).slice(0, 3).map(c => bar(c.text, c.pct, false))));
  box.append(res);
}
let raf = 0;
// ---- class timer: digits in the footer on every view; huge when nothing else is showing; optional soft chime at zero ----
let upT = 0;
function timerPaint(t) {
  const up = !!upT, on = up || (t && t.running), low = !up && t.running && t.secs <= 10 && !t.paused;
  const dig = up ? '0:00' : t.running ? TK.fmt(t.secs) : '', word = up ? 'Time is up' : t.running ? (t.paused ? 'Paused' : low ? 'Almost time' : '') : '';
  for (const [d, w, box] of [['#fdig', '#fw', '#ftimer'], ['#tbd', '#tbw', '#tbig']]) {
    if ($(d).textContent !== dig) $(d).textContent = dig; $(w).textContent = word;
    $(box).classList.toggle('low', low); $(box).classList.toggle('up', up);
  }
  $('#ftimer').hidden = !on;
  if (!!S.tOn !== !!on) { S.tOn = !!on; draw(); }
}
TK.onTick(t => { if (upT) { if (!t.running) return; clearTimeout(upT); upT = 0; } timerPaint(t); });
TK.onDone(() => { upT = setTimeout(() => { upT = 0; timerPaint({ running: false }); }, 5000); timerPaint({ running: false }); chimeNow(); });
// the chime is off unless someone on this screen turns it on (a click is also what lets the browser play sound)
let chimeOn = false, actx = null; try { chimeOn = localStorage.do_pchime === '1'; } catch {}
function chimeUI() { const b = $('#chime'); b.setAttribute('aria-pressed', chimeOn ? 'true' : 'false'); b.querySelector('span').textContent = chimeOn ? 'Chime on' : 'Chime off'; }
function chimeNow() {
  if (!chimeOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    [[659.25, 0], [880, .28]].forEach(([f, at]) => { const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(.16, t0 + .04); g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.1); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 1.2); });
  } catch {}
}
$('#chime').onclick = () => { chimeOn = !chimeOn; try { localStorage.do_pchime = chimeOn ? '1' : '0'; } catch {} if (chimeOn) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} chimeNow(); } chimeUI(); };
chimeUI(); timerPaint({ running: false });
function draw() { if (!raf) raf = requestAnimationFrame(paint); } // many updates in one frame = one repaint
addEventListener('resize', () => { S.stu.forEach(s => (s.d = true)); draw(); }); // panels grow or shrink with the window
function paint() {
  raf = 0;
  const lbOn = S.board && S.teams.length, waiting = !S.q.question && !S.picks.some(id => S.stu.get(id)) && !lbOn;
  $('#q').innerHTML = S.q.question || (waiting ? 'The next question is coming up' : ''); // server-sanitized: only b/i/u/br
  const sort = S.q.kind === 'sort';
  const picks = S.picks.filter(id => S.stu.get(id));
  const drawings = sort ? [] : picks; // side by side is for drawings; a sort question shows one student
  const one = picks[0] ? S.stu.get(picks[0]) : null;
  const sum = !picks.length && (sort || !!S.q.model) && S.sres && S.sum && S.sum.n > 0;
  const lb = !picks.length && !sum && S.board && S.teams.length;
  document.body.classList.toggle('frozen', !!S.frozen);
  $('#boards').hidden = !drawings.length;
  $('#sb').hidden = !(one && sort);
  $('#sm').hidden = !sum;
  const tbig = S.tOn && !picks.length && !lb && !sum; // a full-screen countdown only when nothing else is on the screen
  $('#tbig').hidden = !tbig;
  $('#join').hidden = !!picks.length || !!lb || !!sum || tbig;
  $('#lb').hidden = !lb; if (!lb) $('#lbnote').hidden = true;
  if (lb) board();
  if (sum) sortSummary();
  if (drawings.length) paintBoards(drawings);
  if (one && sort) {
    const left = sortBoard(one), who = S.hide ? 'A student’s work' : one.name + '’s work';
    $('#who').textContent = who + (picks.length > 1 ? ' · showing 1 of ' + picks.length + ' (side by side is for drawings)' : '') + (left ? ' · ' + left : '');
  } else $('#who').textContent = '';
}
// Each drawing is shown at the biggest size that fits its panel without stretching it: the box takes the shape of that
// student's own page, so a phone drawing stays tall and a tablet one stays wide (no gray bars, never squashed).
function fitPanel(b, s) { // true = the canvas was resized (so it must be painted again), null = no layout yet
  const r = b.wrap.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  if (r.width < 8 || r.height < 8) return null;
  const a = (s.bw || 800) / (s.bh || 500);
  let w = Math.min(r.width, r.height * a), h = w / a;
  if (h > r.height) { h = r.height; w = h * a; }
  b.cv.style.width = w + 'px'; b.cv.style.height = h + 'px';
  const bw = Math.round(w * d), bh = Math.round(h * d);
  if (b.wrap.dataset.w === String(w) && b.wrap.dataset.h === String(h) && b.cv.width === bw && b.cv.height === bh) return false;
  b.wrap.dataset.w = w; b.wrap.dataset.h = h;
  b.cv.width = bw; b.cv.height = bh; // setting a canvas size clears it, so this always needs a repaint
  return true;
}
// up to 3 drawings side by side; each panel is built once and kept, so a redraw does not flicker
const panels = new Map();
function paintBoards(ids) {
  const box = $('#boards'), want = new Set(ids);
  panels.forEach((b, id) => { if (!want.has(id)) { b.el.remove(); panels.delete(id); } });
  ids.forEach((id, i) => {
    let b = panels.get(id);
    if (!b) {
      const el = document.createElement('div'); el.className = 'bp';
      el.innerHTML = '<div class="bph"><b></b><span class="pchip" hidden></span></div><div class="bpc"><canvas></canvas></div>';
      box.append(el);
      b = { el, wrap: el.querySelector('.bpc'), cv: el.querySelector('canvas'), nm: el.querySelector('b'), chip: el.querySelector('.pchip') };
      panels.set(id, b); S.stu.get(id).d = true;
    }
    b.el.style.order = i; b.el.classList.toggle('c3', ids.length === 3 && i === 2);
  });
  // columns first: the canvases are measured against their real width, so a two or three up never looks stretched
  box.classList.toggle('three', ids.length === 3); box.style.gridTemplateColumns = ids.length === 3 ? 'repeat(2,minmax(0,1fr))' : 'repeat(' + ids.length + ',minmax(0,1fr))';
  document.body.classList.toggle('multi', ids.length > 1);
  ids.forEach(id => {
    const s = S.stu.get(id), b = panels.get(id);
    b.nm.textContent = S.hide ? 'A student’s work' : s.name + '’s work';
    const p = pulseOf(s.pulse);
    b.chip.hidden = !p;
    if (p) { b.chip.textContent = p.e + ' ' + p.n; b.chip.style.background = p.soft; b.chip.style.color = p.c; }
    const resized = fitPanel(b, s);
    if (resized === null) { s.d = true; setTimeout(draw, 90); return; } // no layout yet (a panel that is still being shown)
    if (!s.d && !resized) return;
    s.d = false;
    paintBoard(b.cv, s.objs, S.q.bg, S.im, s.bw, s.bh, S.q.model ? { model: S.q.model, pl: s.pl || {} } : undefined);
  });
}
