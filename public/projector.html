<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out – Projector</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/sortkit.css">
<style>
body{background:#0b1220;color:#fff}
.qbar{background:transparent;font-size:34px;text-align:center}
#join{text-align:center;margin-top:40px;font-size:30px}
#join b{font-size:90px;letter-spacing:.2em;display:block;color:#93c5fd}
#who{text-align:center;font-size:24px;margin-top:10px;color:#93c5fd}
main{max-width:1000px}
canvas{border:0}
#lb{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.lr{display:grid;grid-template-columns:70px 1fr 90px;align-items:center;gap:14px;transition:transform .5s}
.lr .nm{font-size:34px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .rk{font-size:44px;text-align:center;opacity:.8}
.lr .bar{height:34px;border-radius:10px;min-width:12px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.lr .pt{font-size:56px;font-weight:800;text-align:right}
.lr.pop .pt{animation:pop .9s}
@keyframes pop{30%{transform:scale(1.5);color:#fde047}}
/* sort questions: one student's lanes, or the whole class's results */
#sb{display:grid;gap:14px;margin-top:10px}
#sb .slane{background:#fff;color:#111827;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:300px}
#sb .slane h3{margin:0;font-size:30px;text-align:center}
#sb .nc{font-size:26px;padding:12px 14px;cursor:default}
#sm{display:flex;flex-direction:column;gap:12px;margin-top:6px}
#sm h2{margin:10px 0 0;font-size:26px;color:#93c5fd}
.sr{display:grid;grid-template-columns:minmax(0,1fr) 110px;align-items:center;gap:6px 16px}
.sr .nm{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .bar{grid-column:1;height:30px;border-radius:10px;min-width:12px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.sr .pt{grid-column:2;grid-row:1/3;font-size:44px;font-weight:800;text-align:right}
#corner{position:fixed;top:12px;right:18px;font-size:22px;color:#93c5fd}
#corner b{letter-spacing:.15em;color:#fff}
</style>
</head>
<body>
<div id="corner" hidden>Join: <b id="ccode"></b></div>
<main>
 <div class="qbar" id="q"></div>
 <div id="lb" hidden></div>
 <div id="sb" hidden></div>
 <div id="sm" hidden></div>
 <canvas id="cv" width="1280" height="800" hidden></canvas>
 <div id="join">Go to <span id="url"></span><b id="code"></b><div id="qr" aria-label="QR code to join" style="width:260px;height:260px;margin:20px auto 0;background:#fff;border-radius:12px;padding:6px"></div><div style="font-size:20px;margin-top:8px;color:#93c5fd">or scan to join</div></div>
 <div id="who"></div>
</main>
<script src="/qrcode.js"></script>
<script src="/common.js"></script>
<script src="/sortkit.js"></script>
<script>
const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
$('#url').textContent = location.host; $('#code').textContent = code;
try { $('#qr').innerHTML = qrSvg(location.origin + '/?code=' + code); } catch (e) { $('#qr').hidden = true; }
const S = { q: { question: '', bg: 'graph', img: null }, im: null, spot: null, hide: true, board: false, teams: [], scores: {}, sres: false, sum: null, stu: new Map() };
$('#ccode').textContent = code;
const ws = connect(onmsg, () => ws.send({ t: 'watch', code }), ok => { if (!ok) $('#who').textContent = 'Reconnecting…'; });

function setQ(q) { S.q = q; S.im = loadImg(q.img, draw); }
function onmsg(m) {
  const s = S.stu.get(m.id);
  switch (m.t) {
    case 'err': $('#who').textContent = m.m; setTimeout(() => ws.send({ t: 'watch', code }), 3000); return;
    case 'state': S.stu.clear(); S.spot = m.spot; S.hide = m.hide; S.board = !!m.board; S.teams = m.teams || []; S.scores = m.scores || {}; setQ(m.q);
      m.students.forEach(d => S.stu.set(d.id, { name: d.name, objs: d.objs, bw: d.bw, bh: d.bh, sort: d.sort || {} })); S.sres = !!m.sres; S.sum = null; break;
    case 'join': S.stu.set(m.s.id, { name: m.s.name, objs: m.s.objs, bw: m.s.bw, bh: m.s.bh, sort: m.s.sort || {} }); break;
    case 'set': if (s) { const i = s.objs.findIndex(o => o.id === m.o.id); if (i >= 0) s.objs[i] = m.o; else s.objs.push(m.o); } break;
    case 'pts': if (s) { const o = s.objs.find(o => o.id === m.oid); if (o) o.pts.push(...m.p); } break;
    case 'del': if (s) s.objs = s.objs.filter(o => o.id !== m.oid); break;
    case 'all': if (s) s.objs = m.objs; break;
    case 'q': setQ(m.q); S.sum = null; S.stu.forEach(x => { x.objs = []; x.sort = {}; }); break;
    case 'sort': if (s) s.sort = m.p; break;
    case 'sres': S.sres = m.on; break;
    case 'sum': S.sum = m; break;
    case 'spot': S.spot = m.spot; S.hide = m.hide; break;
    case 'score': S.teams = m.teams; S.scores = m.scores; break;
    case 'board': S.board = m.on; break;
    case 'gone': S.stu.delete(m.id); break;
  }
  draw();
}
// leaderboard: one persistent row per team so bars slide and rows reorder smoothly
const rows = new Map(); let prev = {};
function board() {
  const box = $('#lb'), max = Math.max(1, ...S.teams.map(t => S.scores[t.id] || 0)), order = [...S.teams].sort((a, b) => (S.scores[b.id] || 0) - (S.scores[a.id] || 0));
  rows.forEach((r, id) => { if (!S.teams.some(t => t.id === id)) { r.el.remove(); rows.delete(id); } });
  S.teams.forEach(t => {
    let r = rows.get(t.id);
    if (!r) { const el = document.createElement('div'); el.className = 'lr'; el.innerHTML = '<div class="rk"></div><div><div class="nm"></div><div class="bar"></div></div><div class="pt"></div>'; box.append(el); r = { el }; rows.set(t.id, r); }
    const sc = S.scores[t.id] || 0, i = order.indexOf(t);
    r.el.style.order = i; r.el.querySelector('.rk').textContent = i === 0 && sc > 0 ? '🏆' : i + 1;
    r.el.querySelector('.nm').textContent = (t.emoji ? t.emoji + ' ' : '') + t.name;
    const bar = r.el.querySelector('.bar'); bar.style.background = t.color; bar.style.width = Math.max(2, sc / max * 100) + '%';
    r.el.querySelector('.pt').textContent = sc;
    if (prev[t.id] !== undefined && sc > prev[t.id]) { r.el.classList.remove('pop'); void r.el.offsetWidth; r.el.classList.add('pop'); }
    prev[t.id] = sc;
  });
}
// one student's sort: their lanes with their sticky notes (the projector never gets the answer key, so no right or wrong here)
function sortBoard(s) {
  const sq = S.q.sort, box = $('#sb'); box.textContent = ''; box.style.gridTemplateColumns = 'repeat(' + sq.lanes.length + ',minmax(0,1fr))';
  sq.lanes.forEach(l => {
    const d = document.createElement('div'); d.className = 'slane'; const h = document.createElement('h3'); h.textContent = l.name; d.append(h);
    sq.cards.filter(c => s.sort[c.id] === l.id).forEach(c => d.append(SK.note(c)));
    box.append(d);
  });
  const left = sq.cards.filter(c => !s.sort[c.id]).length;
  return left ? left + ' card' + (left === 1 ? '' : 's') + ' still to place' : '';
}
// the whole class: how each idea and the hardest cards went
function sortSummary() {
  const box = $('#sm'), m = S.sum; box.textContent = '';
  const h = t => { const e = document.createElement('h2'); e.textContent = t; return e; };
  const row = (name, pct) => {
    const r = document.createElement('div'); r.className = 'sr'; const n = document.createElement('div'); n.className = 'nm'; n.textContent = name;
    const b = document.createElement('div'); b.className = 'bar'; b.style.width = Math.max(2, pct) + '%'; b.style.background = { good: '#34d399', mid: '#fbbf24', bad: '#f87171' }[SK.tier(pct)];
    const p = document.createElement('div'); p.className = 'pt'; p.textContent = pct + '%'; r.append(n, b, p); return r;
  };
  box.append(h('Class results · ' + m.n + ' student' + (m.n === 1 ? '' : 's')));
  if (m.ideas.length) { box.append(h('Ideas')); m.ideas.forEach(i => box.append(row(i.name, i.pct))); }
  box.append(h('Hardest cards')); m.cards.slice().sort((a, b) => a.pct - b.pct).slice(0, 3).forEach(c => box.append(row(c.text, c.pct)));
}
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(paint); } // many updates in one frame = one repaint
function paint() {
  raf = 0;
  $('#q').innerHTML = S.q.question; // server-sanitized: only b/i/u/br
  const s = S.stu.get(S.spot);
  const sort = S.q.kind === 'sort', sum = !s && sort && S.sres && S.sum && S.sum.n > 0;
  const lb = !s && !sum && S.board && S.teams.length;
  $('#cv').hidden = !s || sort; $('#sb').hidden = !(s && sort); $('#sm').hidden = !sum;
  $('#join').hidden = !!s || !!lb || !!sum; $('#lb').hidden = !lb; $('#corner').hidden = !(lb || sum);
  if (lb) board();
  if (sum) sortSummary();
  if (s) {
    const who = S.hide ? 'A student’s work' : s.name + '’s work';
    if (sort) { const left = sortBoard(s); $('#who').textContent = who + (left ? ' · ' + left : ''); }
    else { paintBoard($('#cv'), s.objs, S.q.bg, S.im, s.bw, s.bh); $('#who').textContent = who; }
  } else $('#who').textContent = '';
}
</script>
</body>
</html>
