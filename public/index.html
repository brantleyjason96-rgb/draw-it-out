<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/sortkit.css">
<style>
/* join screen: one calm card, big code field, visible labels, clear focus ring */
body:has(#join:not([hidden])){background:var(--bg) linear-gradient(180deg,var(--c-primary-tint) 0,var(--bg) 320px) no-repeat}
#join .card{max-width:400px;margin:clamp(12px,4vh,72px) auto;padding:28px 24px 20px;text-align:center;border-radius:20px;border-color:var(--c-primary-line);box-shadow:var(--sh-2)}
#join .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;font-weight:700;font-size:15px;color:var(--c-question);letter-spacing:.02em}
#join .brand svg{width:32px;height:32px;flex:none}
#join h1{margin:0 0 4px;font-size:28px;line-height:1.15}
#join #jh{color:var(--c-muted);margin:0 0 16px;font-size:16px}
#join label{display:block;text-align:left;font-size:14px;font-weight:600;color:var(--ink);margin:0 0 6px}
#join label:has(+ [hidden]){display:none}
#join input{width:100%;padding:12px;font-size:20px;margin:0 0 14px;border:2px solid var(--c-control);border-radius:12px;text-align:center;background:#fff;transition:border-color .15s,box-shadow .15s}
#join input:focus-visible{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--c-primary-glow)}
#join input[readonly]{background:var(--c-bg);color:var(--c-ink-2)}
#join #code{letter-spacing:.3em;text-transform:uppercase;font-size:34px;font-weight:700;padding:16px 12px}
#join .btn{width:100%;min-height:52px;font-size:18px;font-weight:600;border-radius:12px;transition:background-color .15s,transform .1s}
#join .btn:hover{background:var(--c-primary-strong)}
#join .btn:active{transform:scale(.98)}
#join .btn:focus-visible,#join .tlink:focus-visible,#pick button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#join .tlink{display:inline-block;padding:12px 8px;margin-top:6px;font-size:15px;color:var(--c-muted);text-decoration:underline;text-underline-offset:3px}
#pick button{transition:border-color .15s,transform .1s}
#pick button:not(:disabled):hover{transform:translateY(-2px)}
#err{color:var(--c-bad);min-height:1.4em;margin:0 0 10px;font-weight:600}
@media(prefers-reduced-motion:reduce){#join *{transition:none!important}#pick button:hover,#join .btn:active{transform:none!important}}
/* sort questions: lanes to fill with sticky notes, a pile of cards below */
body.sorting #stage,body.sorting #toolsbtn,body.sorting #drawer,body.sorting #ur,body.sorting #zoom,body.sorting #quick,body.sorting #mini,body.sorting #selbar{display:none!important}
#sortview{position:fixed;left:12px;right:12px;top:96px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:10px}
#sstage{flex:1;min-height:0;display:grid;gap:10px}
.slane{background:#fff;border:2px dashed var(--c-control);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-width:0;transition:background .1s,border-color .1s}
.slane.over{background:var(--c-primary-soft);border-color:var(--pri)}
.slane h3{margin:0;font-size:18px;text-align:center;overflow-wrap:anywhere;hyphens:manual}
@media(max-width:700px){.slane{padding:8px 6px}.slane .nc{font-size:13px;padding:6px 6px}.slane h3{font-size:14px;line-height:1.2}}
#sbar{flex:none;display:flex;gap:10px;align-items:stretch}
#spile{flex:1;min-width:0;max-height:34vh;overflow:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--sh-2);transition:background .1s}
#spile.over{background:var(--c-primary-soft)}
#spile h4{flex-basis:100%;margin:0;font-size:13px;color:var(--mut);font-weight:600}
#spile .nc{width:200px}
#spile .sempty{flex-basis:100%;color:var(--c-good-strong);font-weight:600;padding:8px 0}
#sdone{flex:none;width:210px;display:flex;flex-direction:column;gap:6px;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--sh-2)}
#sdone b{text-align:center;font-size:15px}
#smsg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34vh + 24px);z-index:13;background:var(--c-warn);color:#fff;border-radius:12px;padding:8px 16px;font-size:18px;box-shadow:var(--sh-2);white-space:nowrap}
.nc.sel{outline:3px solid var(--pri)}
#sortview [role=button]:focus-visible{outline:3px solid var(--c-dark);outline-offset:2px;box-shadow:0 0 0 5px #fff}
@media(pointer:coarse){#sortview .nc[data-card]{min-height:44px;display:flex;flex-direction:column;justify-content:center}}
#sortview.sdone #sstage{opacity:.85}
@media(max-width:700px){#spile .nc{width:calc(50% - 4px)}#sbar{flex-direction:column}#sdone{width:auto;flex-direction:row;align-items:center;justify-content:space-between}#smsg{font-size:15px;white-space:normal;text-align:center;width:calc(100% - 24px)}}
#pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:0 0 12px}
#pick button{border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-size:18px;font-weight:600;cursor:pointer;min-height:64px;line-height:1.2}
#pick button small{display:block;font-weight:400;color:var(--mut);font-size:13px}
#pick button .em{font-size:30px;display:block}
#pick button:disabled{opacity:.4;cursor:not-allowed}
#pick button.on{position:relative;background:var(--c-primary-soft);box-shadow:0 0 0 3px var(--c-ink)}
#pick button.on::after{content:'✓';position:absolute;top:2px;right:8px;font-size:var(--fs-lg);font-weight:800;color:var(--c-ink)}
#pick .back{grid-column:1/-1;min-height:44px;font-size:15px;font-weight:400;border-style:dashed}
#tm{display:block;width:fit-content;border-radius:8px;padding:2px 12px;font-size:15px;font-weight:600;margin-bottom:6px;color:var(--c-ink);background:#fff;border:0;border-left:10px solid var(--tc,var(--c-muted))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:#fff;color:var(--ink);padding:8px 12px;min-height:44px}
.seg button.on{background:var(--ink);color:#fff}

body.playing{overflow:hidden;background:var(--c-desk);overscroll-behavior:none}
body.playing main{padding:0;max-width:none}
#quick{display:none;position:fixed;left:12px;bottom:10px;z-index:12;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--sh-2)}
#quick{gap:6px}
#quick .swb{width:44px;height:44px;min-height:44px}
.qt{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:22px;line-height:1;transition:background-color .15s,color .15s,border-color .15s,transform .08s}
.qt:active{transform:scale(.93)}
.qt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qsep{width:1px;height:32px;background:var(--line);margin:0 4px}
@media(max-width:900px){body.simple #ur{left:12px;transform:none;bottom:72px}body.simple #zoom{bottom:72px}body.simple #mini{bottom:134px}}
body.simple #quick{display:flex}
body.simple #toolsbtn,body.simple #drawer{display:none!important}
#lockmsg{position:fixed;top:auto;bottom:140px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);text-align:center;z-index:13;background:var(--c-warn);color:#fff;border-radius:12px;padding:8px 16px;font-size:18px;box-shadow:var(--sh-2)}
.locked .lockable{opacity:.45;pointer-events:none}
button{cursor:pointer}
#stage{position:fixed;inset:0}
#cv{width:100%;height:100%;display:block;touch-action:none;border:0;border-radius:0;background:none}
#qbox{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:12;background:var(--c-question);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;font-size:20px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh-2)}
#qbox span{padding-top:2px}
#qt{flex:none;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:9px;min-height:44px;padding:0 14px;font-size:14px}
#qbox.min{width:auto}#qbox.min span{display:none}#qbox.min #qt:before{content:'❓ Show question  '}
#qbox:not(.min) #qt:before{content:'Hide ▲'}
#tools{display:flex;flex-direction:column;gap:6px;padding:8px;width:84px;flex:none}
#drawer{position:fixed;left:0;top:0;bottom:0;width:340px;z-index:20;background:var(--c-bg);box-shadow:var(--sh-3);transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.03);display:flex;flex-direction:column;border-radius:0 18px 18px 0}
#drawer.open{transform:none}
/* the contents drift in a heartbeat after the drawer itself, so opening feels like one motion, not a jump */
#drawer.open #tools,#drawer.open #opts{animation:tin .22s ease-out both}
#drawer.open #opts{animation-delay:.05s}
@keyframes tin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#dhead{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--c-dark);color:#fff;border-radius:0 18px 0 0}
#dhead b{flex:1}#dhead button{background:var(--c-ink-2);color:#fff;border:0;border-radius:9px;min-height:44px;padding:0 12px}
#dhead button.on{background:var(--pri)}
#dbody{display:flex;gap:10px;padding:10px;overflow:auto;flex:1;align-items:flex-start}
#dfoot{flex:none;border-top:1px solid var(--line);background:#fff;padding:10px}
#dfoot button{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--c-bad);font-weight:600;font-size:15px}
#opts{flex:1;min-width:0}
#toolsbtn{position:fixed;left:12px;bottom:10px;z-index:12;height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--c-dark);color:#fff;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:var(--sh-2);transition:background-color .15s,transform .08s}
#toolsbtn:hover{background:var(--c-dark-2)}
#toolsbtn:active{transform:scale(.97)}
#toolsbtn b{font-size:22px;font-weight:400}#toolsbtn i{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
#ur,#zoom{position:fixed}
#ur{left:50%;transform:translateX(-50%);bottom:10px}
#zoom{right:12px;bottom:10px}
#mini{right:12px;bottom:72px;left:auto}
.ov{position:absolute;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--sh-1);z-index:6}
.ov button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:20px;line-height:1}
.ov button:disabled{opacity:.35;cursor:default}

#ur button{width:auto;padding:0 12px;font-size:15px}

#zoom button{font-weight:700}
#zoom .fit{width:auto;min-width:44px;padding:0 12px;font-size:14px;font-weight:400}
#zoom input{width:110px;min-height:44px;margin:0;touch-action:pan-y}
#zv{min-width:48px;text-align:center;font-weight:700}
#mini{position:fixed;width:120px;aspect-ratio:8/5;background:#fff;border:2px solid var(--ink);border-radius:6px;z-index:6;touch-action:none;box-shadow:var(--sh-1);cursor:pointer}
#mv{position:absolute;border:2px solid var(--pri);background:var(--c-primary-glow);border-radius:3px}
#selbar{top:0;left:0;z-index:7}
#selbar button.del{background:var(--c-bad-soft);border-color:var(--c-bad-line)}
#ed{position:absolute;display:none;margin:0;padding:0;border:0;outline:2px solid var(--pri);background:rgba(255,255,255,.9);font-family:"Segoe Print","Comic Sans MS",system-ui,sans-serif;line-height:1.25;resize:none;overflow:hidden;z-index:5}
/* toolbar */
#tools{display:flex;flex-direction:column;gap:6px;padding:8px}
.tool{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-sm);transition:background-color .15s,color .15s,border-color .15s,transform .08s}
.tool b{font-size:24px;font-weight:400;line-height:1}
.tool:active{transform:scale(.95)}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* options */
#opts .sec{margin-bottom:14px}
#opts h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px}
.swb{aspect-ratio:1;min-height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);transition:box-shadow .12s,transform .12s}
.swb:active{transform:scale(.92)}
.swb.on{box-shadow:0 0 0 3px var(--pri)}
@media(pointer:fine){.swb:hover,.wheelbtn:hover{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}#drawer.open #tools,#drawer.open #opts{animation:none}.tool,.qt,.swb,#toolsbtn{transition:none!important}.tool:active,.qt:active,.swb:active,#toolsbtn:active{transform:none}}
.wheelbtn{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.wheelbox{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
#wheel{width:180px;height:180px;border-radius:50%;touch-action:none;cursor:crosshair}
.wheelbox label{width:100%;font-size:13px;color:var(--mut)}
.wheelbox input[type=range],#opts input[type=range]{width:100%}
.hexrow{display:flex;gap:8px;width:100%}
#chip{width:44px;border-radius:8px;border:1px solid var(--line)}
#hex{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;text-transform:lowercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:48px;padding:6px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--c-primary-line);background:var(--c-primary-soft)}
.opt i{display:block;width:80%;border-radius:99px}
.opt b{font-size:22px;font-weight:400;line-height:1}
#opts .seg{width:100%}#opts .seg button{flex:1;padding:8px 4px}
.hint{color:var(--mut)}.hint b{color:var(--ink);display:block;font-size:17px;margin-bottom:4px}

.tool{min-height:60px}
@media(max-width:760px){#ur{left:12px;transform:none;bottom:72px}#zoom{bottom:72px}#mini{bottom:134px}}
@media(max-width:560px){#zoom input{display:none}}
@media(max-width:620px){#zoom{bottom:10px}#ur{bottom:72px;left:auto;right:12px;transform:none}#ur .lb{display:none}#ur button{min-width:48px;padding:0 10px;font-size:20px}}
@media(max-width:520px){#zoom>span:first-child{display:none}#drawer{width:100%}#qbox{font-size:17px}#zoom input{width:70px}}

@media(max-width:420px){#zv{display:none}}
#qbox :focus-visible,#dhead :focus-visible{outline-color:#fff}
@media(any-pointer:coarse){.sw{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}.swb{min-height:44px}}
/* confidence pulse: red / amber / green on the right edge, clear of the tools on the left.
   The label is the toggle, so the three buttons can be folded into a slim chip while drawing. */
#pulse{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:12;display:none;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--sh-2)}
body.playing:not(.sorting) #pulse{display:flex}
#pulse[data-on=r]{--pc:var(--c-bad)}
#pulse[data-on=y]{--pc:var(--c-warn)}
#pulse[data-on=g]{--pc:var(--c-good)}
#ptog{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 8px;border:0;border-radius:10px;background:#fff;color:var(--mut)}
#ptog:hover{background:var(--c-bg)}
#ptog:active{background:var(--c-fill)}
#ptog .plb{font-size:var(--fs-sm);font-weight:700;color:inherit;line-height:1.2;text-align:left;max-width:130px}
#ptog .pdot{flex:none;width:9px;height:9px;border-radius:50%;background:currentColor;opacity:0;transition:opacity .15s}
#ptog.on{color:var(--pc)}
#ptog.on .pdot{opacity:1}
#ptog .pchev{flex:none;transition:transform .2s;font-size:12px;line-height:1}
#pulse.collapsed #ptog .pchev{transform:rotate(180deg)}
#pbtns{display:flex;flex-direction:column;gap:8px;max-height:170px;opacity:1;visibility:visible;overflow:hidden;transition:max-height .25s cubic-bezier(.2,.9,.3,1),opacity .18s ease,visibility 0s}
#pulse.collapsed #pbtns{max-height:0;opacity:0;visibility:hidden;transition:max-height .25s cubic-bezier(.2,.9,.3,1),opacity .18s ease,visibility 0s .25s}
#pulse .pb{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:15px}
#pulse .pb i{font-style:normal;font-size:20px;line-height:1}
#pulse .pb[data-p=r]{--pc:var(--c-bad);--ps:var(--c-bad-soft)}
#pulse .pb[data-p=y]{--pc:var(--c-warn);--ps:var(--c-warn-soft)}
#pulse .pb[data-p=g]{--pc:var(--c-good);--ps:var(--c-good-soft)}
#pulse .pb.on{border-color:var(--pc);background:var(--ps);box-shadow:0 0 0 3px var(--pc)}
#pulse .pb.on:after{content:'✓';font-weight:800;color:var(--pc);margin-left:auto}
@media(prefers-reduced-motion:reduce){#pbtns,#ptog .pchev,#ptog .pdot{transition:none}}
@media(max-width:620px){
 #pulse .pb span{display:none}
 #pulse .pb{padding:0 10px;min-height:50px;min-width:50px;justify-content:center}
 #ptog{min-width:44px;justify-content:center;padding:0}
 #ptog .plb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} /* off screen, but its name stays with the button for screen readers */
}

/* frozen: the whole class's attention, with a bit of frost */
#frz{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
 background:linear-gradient(180deg,var(--c-frost-soft),var(--c-surface))}
body.frozen #frz{display:flex}
body.frozen #stage,body.frozen #qbox,body.frozen #quick,body.frozen #toolsbtn,body.frozen #drawer,body.frozen #ur,body.frozen #zoom,body.frozen #mini,body.frozen #pulse,body.frozen #selbar,body.frozen #sortview{filter:blur(2px) saturate(.55);pointer-events:none}
#frz:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 52%,rgba(255,255,255,.87) 100%);animation:frost .9s ease-out both}
#frzflakes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#frzflakes i{position:absolute;top:-10vh;font-style:normal;color:var(--c-stage-accent);opacity:.8;animation:snofall linear infinite}
#frzcard{position:relative;z-index:2;background:#fff;border-radius:26px;padding:26px 34px;box-shadow:var(--sh-3);max-width:min(560px,88vw);animation:fzin .5s cubic-bezier(.2,.9,.3,1.25) both}
#frzcard .fi{display:block;font-size:54px;line-height:1;animation:fzwave 2.6s ease-in-out infinite}
#frzcard b{display:block;font-size:34px;margin-top:6px}
#frzcard p{margin:4px 0 0;font-size:18px;color:var(--mut)}
@keyframes fzin{from{transform:scale(.86) translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fzwave{0%,68%,100%{transform:rotate(0)}76%{transform:rotate(13deg)}84%{transform:rotate(-9deg)}}
@keyframes frost{from{opacity:0}to{opacity:1}}
@keyframes snofall{to{transform:translateY(120vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#frzcard,#frz:before,#frzcard .fi{animation:none}#frzflakes{display:none}}

</style>
</head>
<body>
<main>
 <div id="join">
  <form class="card" id="jf">
   <div class="brand" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="#1e3a8a"/><path d="M9 22.5c3-8 6-11 9-9s-1 7 5 2.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.4" fill="#fbbf24"/></svg>Draw It Out</div>
   <h1>Join class</h1>
   <p id="jh">Type your class code</p>
   <label for="code">Class code</label>
   <input id="code" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false">
   <label for="name">Nickname</label>
   <input id="name" maxlength="20" placeholder="Your nickname" autocomplete="off" hidden>
   <div id="pick" hidden></div>
   <p id="err" role="alert"></p>
   <button class="btn" id="go" style="width:100%">Next</button>
   <p style="margin:8px 0 0"><a class="tlink" href="/start">Teacher? Start here</a></p>
  </form>
 </div>

 <div id="play" hidden>
  <div id="stage">
   <canvas id="cv"></canvas>
   <textarea id="ed" maxlength="300" aria-label="Type your text"></textarea>
   <div class="ov lockable" id="selbar" hidden><button class="del" data-a="del" aria-label="Delete">🗑</button><button data-a="dup" aria-label="Duplicate">⧉</button><button data-a="front" aria-label="Bring to front">⬆</button></div>

<script>
let target = null, id = null;

let waking = false;

// Join in steps: class code -> (class list loaded?) team -> your initials, or just a nickname when there is no class list.
const pageSize = () => ({ bw: Math.min(3000, Math.max(300, Math.round(innerWidth - 24))), bh: Math.min(3000, Math.max(300, Math.round(innerHeight - 140))) }); // the page is the size of this screen

function pickBtn(label, sub, color, fn, off) {

  const em = document.createElement('span'); em.className = 'em'; em.textContent = label[0]; b.append(em, label[1]);
  if (sub) { const sm = document.createElement('small'); sm.textContent = sub; b.append(sm); }

}
function renderPick(m) {
  const box = $('#pick'); box.innerHTML = '';

    pickTeam = null; jshow('tiles');
    m.teams.forEach(t => box.append(pickBtn([t.emoji, t.name], t.open ? t.open + ' open' : 'full', t.color, () => ws.send({ t: 'peek', code: target0, team: t.id }), !t.open)));
    const bk = pickBtn(['', '← Different class code'], '', null, () => { $('#err').textContent = ''; jshow('code'); $('#code').focus(); }); bk.className = 'back'; box.append(bk);
  } else { // initials for one team
    pickTeam = m.team; jshow('ini');
    m.list.forEach(e => box.append(pickBtn(['', e.ini], e.taken ? 'in use' : '', null, () => {
      target = { code: target0, rid: e.rid, ...pageSize() }; localStorage.do_code = target0; id = sessionStorage['do_id_' + target0] || null;
      sessionStorage['do_rid_' + target0] = e.rid; // so a refresh can rejoin without asking for initials again
      $('#err').textContent = ''; sendJoin();
    }, e.taken)));
    const bk = pickBtn(['', '← Back to teams'], '', null, () => { $('#err').textContent = ''; ws.send({ t: 'peek', code: target0 }); }); bk.className = 'back'; box.append(bk);
  }
}
// quick teams (no class list): tap a team, nickname optional
function renderQuick() {
  const box = $('#pick'); box.innerHTML = ''; qteam = null;
  quick.forEach(t => { const b = pickBtn([t.emoji, t.name], '', t.color, () => { qteam = t.id; [...box.children].forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); }); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); $('#err').textContent = ''; }); box.append(b); });
}
let target0 = '';
// A refresh (or the tab being closed and reopened by the browser) must not send a student back through the join steps.
// This tab remembers the class code, their id on the server, and - with a class list - which roster entry is theirs,
// so the page rejoins by itself as soon as the socket is open. Nothing leaves this browser that did not already.
let resuming = false;
(function resume() {
  const c = (sp.get('code') || localStorage.do_code || '').toUpperCase();
  if (!/^[A-Z0-9]{4,10}$/.test(c)) return;
  const sid = sessionStorage['do_id_' + c] || null, srid = sessionStorage['do_rid_' + c] || null;
  if (!sid && !srid) return;
  target0 = c; id = sid;
  target = { code: c, name: localStorage.do_name || '', rid: srid || undefined, ...pageSize() };
  resuming = true;
  $('#jh').textContent = 'Going back to your class…';
})();
$('#jf').onsubmit = e => {
  e.preventDefault(); $('#err').textContent = '';
  if (jstep === 'code') {
    target0 = $('#code').value.trim().toUpperCase(); if (!target0) return ($('#err').textContent = 'Type the class code');
    if (!ws.open()) { waking = true; $('#err').textContent = 'Connecting… Please wait. This can take one minute. Stay on this page.'; return; }

    const name = $('#name').value.trim();
    if (quick.length && !qteam) return ($('#err').textContent = 'Tap your team first');
    if (!quick.length && !name) return ($('#err').textContent = 'Type a nickname');
    localStorage.do_code = target0; localStorage.do_name = name;
    id = sessionStorage['do_id_' + target0] || null; target = { code: target0, name, team: qteam, ...pageSize() }; sendJoin();
  }
};
function renderTeam() {
  const t = tmList.find(x => x.id === tmMy), el = $('#tm'); el.hidden = !(t || tmIni);
  el.textContent = (tmIni ? tmIni + ' · ' : '') + (t ? (t.emoji ? t.emoji + ' ' : '') + t.name + ' · ' + (tmSc[t.id] || 0) + ' pts' : 'No team yet');
  el.style.setProperty('--tc', t ? t.color : '#6b7280');
}

function setQ(nq) {
  q = nq; bump(); $('#q').innerHTML = q.question || 'Waiting for your teacher’s question…'; // server-sanitized: only b/i/u/br
  im = loadImg(q.img, draw); draw();
}
function applyLock(proj) { // work on the projector can't be changed

}

// ---- confidence pulse: three taps on the right edge; the label itself folds the buttons to a slim chip ----
let myPulse = null;
const pbox = $('#pulse'), ptog = $('#ptog');
function setPulse(c, tell) {
  myPulse = PULSES[c] ? c : null;

document.querySelectorAll('#pulse .pb').forEach(b => {

foldPulse(localStorage.do_pulsefold === '1', true); // every student keeps their own folded or open choice

// ---- frozen: the teacher has the floor. Nothing here can be touched until it lifts. ----
const FLAKES = '❄✳❅✻❆';
function makeFlakes() {
  const box = $('#frzflakes'); if (box.childElementCount) return;
  for (let i = 0; i < 26; i++) {
    const f = document.createElement('i');
    f.textContent = FLAKES[i % FLAKES.length];

    f.style.fontSize = 10 + Math.random() * 22 + 'px';

function applyFreeze(on) {

  $('#frz').setAttribute('aria-hidden', frozen ? 'false' : 'true');
  if (frozen) { if (editing) commitEdit(true); sel = null; cur = null; g = null; openDrawer(false); makeFlakes(); all(); }
}

function onmsg(m) {
  if (SS.msg(m)) return;
  if (m.t === 'peek') {
    if (!m.roster) { quick = m.teams || []; renderQuick(); jshow('name'); } else renderPick(m);
  } else if (m.t === 'score') { tmList = m.teams; tmSc = m.scores; renderTeam();
  } else if (m.t === 'myteam') { tmMy = m.team; renderTeam();
  } else if (m.t === 'err') {
    if ($('#play').hidden) {
      $('#err').textContent = m.m;
      if (m.taken) { target = null; if (pickTeam !== null) ws.send({ t: 'peek', code: target0, team: pickTeam }); }
      // the automatic rejoin after a refresh did not work (class gone, or that sign-in is taken): show the join steps
      // with the code still filled in, rather than leaving the student on a page that will never load.
      if (resuming) { resuming = false; target = null; id = null; jshow('code'); }
    } else if (m.nocls) setTimeout(sendJoin, 3000); // server restarted: keep retrying until the teacher is back
  } else if (m.t === 'joined') {
    id = m.id; if (target) sessionStorage['do_id_' + target.code] = id; W = m.bw; H = m.bh; // (a page refreshed mid-join may not have a target yet)
    $('#join').hidden = true; $('#play').hidden = false; document.body.classList.add('playing');
    if (m.q.question || m.q.img || !$('#q').innerHTML) setQ(m.q);
    if (!loaded && !objs.length && m.objs.length) resetDoc(m.objs); // page was refreshed: get the drawing back
    tmList = m.teams || []; tmSc = m.scores || {}; tmMy = m.team; tmIni = m.ini; renderTeam();
    SS.joined(m);
    loaded = true; resuming = false; applyLock(!!m.proj); applySimple(!!m.simple); applyFreeze(!!m.frozen); setPulse(m.pulse || null, false);
    if (S.pin && !m.simple && !m.proj) openDrawer(true); // a student who pinned the tools open last time starts with them open again
  } else if (m.t === 'lock') applyLock(!!m.proj);
  else if (m.t === 'freeze') applyFreeze(!!m.on);
  else if (m.t === 'mode') applySimple(!!m.simple);
  else if (m.t === 'kicked') { // teacher cleared the class
    sessionStorage.removeItem('do_id_' + target.code); sessionStorage.removeItem('do_rid_' + target.code); resuming = false;
    target = id = null; loaded = false; resetDoc([]); SS.newQ(null); applyLock(false); applyFreeze(false); setPulse(null, false);
    $('#play').hidden = true; $('#join').hidden = false; document.body.classList.remove('playing'); jshow('code'); $('#err').textContent = m.why === undefined ? 'This class has ended. Your teacher will tell you when to join again.' : m.why;
  } else if (m.t === 'q') { setQ(m.q); resetDoc([]); SS.newQ(m.q); setPulse(null, false); } // a new drawing = a new colour to pick
}


const cv=$('#cv'),cx=cv.getContext('2d'),ed=$('#ed'),opts=$('#opts'),bar=$('#selbar'),mini=$('#mini');

}

 if(S.wheel)h+=`<div class="wheelbox"><canvas id="wheel" width="180" height="180"></canvas><label>Brightness <input type="range" id="val" min="5" max="100" value="${Math.round(S.hsv[2]*100)}"></label><div class="hexrow"><span id="chip" style="background:${col}"></span><input id="hex" value="${col}" maxlength="7" aria-label="Hex color"></div></div>`;

 if(isStroke)h+=`<div class="sec" data-pin="8"><h4>Pen type</h4><div class="grid">${Object.entries(PEN).map(([k,p])=>`<button class="opt${(o?o.pen:S.pen)===k?' on':''}" data-k="pen" data-v="${k}"><i style="height:${Math.min(16,3+p.m*2.2)}px;background:${col};opacity:${p.a}"></i>${p.n}</button>`).join('')}</div></div>`;
 if(isShape||m==='shape'||isLine){
  const set=isLine?LINES:(o&&isShape?SHAPES:{...SHAPES,...LINES}),cs=o?o.s:S.shape;
  h+=`<div class="sec"><h4>${o?'Change shape':'Shape'}</h4><div class="grid g4">${Object.entries(set).map(([k,i])=>`<button class="opt${cs===k?' on':''}" data-k="shape" data-v="${k}" aria-label="${k}"><b>${i}</b></button>`).join('')}</div></div>`;
 }
 if(isShape)h+=`<div class="sec"><h4>Fill</h4>${seg('fill',[['none','None'],['light','Light'],['solid','Solid']],o?o.fill:S.fill)}</div>`;
 if(isText)h+=`<div class="sec"><h4>Text size</h4>${seg('text',[[20,'S'],[32,'M'],[48,'L'],[72,'XL']],o?Math.round(o.size):S.text)}${o?'<p class="hint" style="margin:8px 0 0;font-size:13px">Drag a corner circle to resize, or the side circles to change width.</p>':'<p class="hint" style="margin:8px 0 0;font-size:13px">Tap the page, then type.</p>'}</div>`;
 else{
  const v=o?o.lw:S.size;
  h+=`<div class="sec"><h4>Thickness <span id="szv">${(+v).toFixed(1)}</span></h4><input type="range" id="size" min="1" max="30" step=".5" value="${v}">${V.z>1&&!o?'<p class="hint" style="margin:6px 0 0;font-size:13px">Zoomed in: pen automatically draws finer detail.</p>':''}</div>`;
  h+=`<div class="sec"><h4>Line style</h4>${seg('dash',[['solid','Solid'],['dashed','Dashed'],['dotted','Dotted']],o?o.dash:S.dash)}</div>`;
 }
 opts.innerHTML=h;drawWheel();
}
opts.onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.act==='wheel'){S.wheel=!S.wheel;renderOpts()}else if(b.dataset.k)setProp(b.dataset.k,b.dataset.v)};
opts.oninput=e=>{
 if(e.target.id==='esize'){S.esize=+e.target.value;$('#esv').textContent=S.esize;draw()}
 else if(e.target.id==='size'){setProp('size',e.target.value,true);$('#szv').textContent=(+e.target.value).toFixed(1)}
 else if(e.target.id==='val'){S.hsv[2]=e.target.value/100;setColor(hsv2hex(...S.hsv))}
 else if(e.target.id==='hex'&&/^#[0-9a-f]{6}$/i.test(e.target.value)){S.hsv=hex2hsv(e.target.value);setColor(e.target.value.toLowerCase());}
};
opts.onchange=()=>{if(sel)commit()};
opts.onpointerup=e=>{if(e.target.id==='wheel'&&sel)commit()};
opts.onpointerdown=e=>{
 if(e.target.id!=='wheel')return;const c=e.target;c.setPointerCapture(e.pointerId);
 const f=ev=>{const r=c.getBoundingClientRect(),dx=ev.clientX-r.left-r.width/2,dy=ev.clientY-r.top-r.height/2;
  S.hsv=[(Math.atan2(dy,dx)*180/Math.PI+360)%360,Math.min(1,Math.hypot(dx,dy)/(r.width/2)),S.hsv[2]];setColor(hsv2hex(...S.hsv))};
 f(e);c.onpointermove=ev=>ev.buttons&&f(ev);
};

/* ---------- server sync: send only what changed since the last send ---------- */
function sync(){
 const ids=objs.map(o=>o.id),prev=[...synced.keys()],isNew=o=>!synced.has(o.id);
 const reorder=ids.filter(i=>synced.has(i)).join()!==prev.filter(i=>ids.includes(i)).join()||objs.some((o,i)=>isNew(o)&&objs.slice(i+1).some(x=>!isNew(x)));
 if(reorder){ws.send({t:'all',objs});synced=new Map(objs.map(o=>[o.id,JSON.stringify(o)]));return}
 prev.forEach(i=>{if(!ids.includes(i)){ws.send({t:'del',oid:i});synced.delete(i)}});
 objs.forEach(o=>{const j=JSON.stringify(o);if(synced.get(o.id)!==j){ws.send({t:'set',o});synced.set(o.id,j)}});
}
let pend=[],pendId=0,pendT=0;
function streamPts(o,p){ // live pen strokes: batch new points ~15 times a second
 pend.push(p);pendId=o.id;if(pendT)return;
 pendT=setTimeout(()=>{pendT=0;if(pend.length)ws.send({t:'pts',oid:pendId,p:pend});pend=[]},70);
}
function resetDoc(list){
 bump();commitEdit(true);objs=list;sel=null;cur=null;g=null;hist=[JSON.stringify(objs)];hi=0;
 synced=new Map(objs.map(o=>[o.id,JSON.stringify(o)]));uid=Math.max(uid,...objs.map(o=>o.id+1),1);V={z:1,ox:0,oy:0};all();
}

new ResizeObserver(()=>{const d=devicePixelRatio||1;if(!cv.clientWidth||!cv.clientHeight)return;cv.width=Math.max(1,cv.clientWidth*d);cv.height=Math.max(1,cv.clientHeight*d);clampView();all(true)}).observe(cv);
renderOpts();
</script>
</body>
