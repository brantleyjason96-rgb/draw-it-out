<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out</title>
<link rel="stylesheet" href="/style.css">
<style>
#join .card{max-width:380px;margin:40px auto;text-align:center}
#join input{width:100%;padding:12px;font-size:20px;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;text-align:center}
#join #code{letter-spacing:.3em;text-transform:uppercase}
#err{color:#b91c1c;min-height:1.4em;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:#fff;color:var(--ink);padding:8px 12px;min-height:44px}
.seg button.on{background:var(--ink);color:#fff}

body.playing{overflow:hidden;background:#d1d5db;overscroll-behavior:none}
body.playing main{padding:0;max-width:none}
#quick{display:none;position:fixed;left:12px;bottom:10px;z-index:12;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px #0004}
#quick .swb{width:48px;height:48px;min-height:48px}
body.simple #quick{display:flex}
body.simple #toolsbtn,body.simple #drawer{display:none!important}
#lockmsg{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:13;background:#92400e;color:#fff;border-radius:12px;padding:8px 16px;font-size:18px;box-shadow:0 4px 14px #0004}
.locked .lockable{opacity:.45;pointer-events:none}
button{cursor:pointer}
#stage{position:fixed;inset:0}
#cv{width:100%;height:100%;display:block;touch-action:none;border:0;border-radius:0;background:none}
#qbox{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:12;background:#1e3a8a;color:#fff;border-radius:14px;padding:10px 12px 10px 18px;font-size:20px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 4px 14px #0004}
#qbox span{flex:1;padding-top:2px}
#qt{flex:none;border:0;background:#ffffff26;color:#fff;border-radius:9px;height:34px;padding:0 12px;font-size:14px}
#qbox.min{width:auto}#qbox.min span{display:none}#qbox.min #qt:before{content:'❓ Show question  '}
#qbox:not(.min) #qt:before{content:'Hide ▲'}
#tools{display:flex;flex-direction:column;gap:6px;padding:8px;width:84px;flex:none}
#drawer{position:fixed;left:0;top:0;bottom:0;width:340px;z-index:20;background:#f3f4f6;box-shadow:4px 0 18px #0004;transform:translateX(-105%);transition:transform .2s;display:flex;flex-direction:column}
#drawer.open{transform:none}
#dhead{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#111827;color:#fff}
#dhead b{flex:1}#dhead button{background:#374151;color:#fff;border:0;border-radius:9px;min-height:40px;padding:0 12px}
#dhead button.on{background:var(--pri)}
#dbody{display:flex;gap:10px;padding:10px;overflow:auto;flex:1;align-items:flex-start}
#opts{flex:1;min-width:0}
#toolsbtn{position:fixed;left:12px;bottom:10px;z-index:12;height:52px;padding:0 18px;border-radius:14px;border:0;background:#111827;color:#fff;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 4px 14px #0005}
#toolsbtn b{font-size:22px;font-weight:400}#toolsbtn i{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
#ur,#zoom{position:fixed}
#ur{left:50%;transform:translateX(-50%);bottom:10px}
#zoom{right:12px;bottom:10px}
#mini{right:12px;bottom:72px;left:auto}
.ov{position:absolute;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 2px 8px #0002;z-index:6}
.ov button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:20px;line-height:1}
.ov button:disabled{opacity:.35;cursor:default}

#ur button{width:auto;padding:0 12px;font-size:15px}

#zoom button{font-weight:700}
#zoom .fit{width:auto;padding:0 10px;font-size:14px;font-weight:400}
#zoom input{width:110px}
#zv{min-width:48px;text-align:center;font-weight:700}
#mini{position:fixed;width:120px;aspect-ratio:8/5;background:#fff;border:2px solid var(--ink);border-radius:6px;z-index:6;touch-action:none;box-shadow:0 2px 8px #0002;cursor:pointer}
#mv{position:absolute;border:2px solid var(--pri);background:#2563eb33;border-radius:3px}
#selbar{top:0;left:0;z-index:7}
#selbar button.del{background:#fee2e2;border-color:#fca5a5}
#ed{position:absolute;display:none;margin:0;padding:0;border:0;outline:2px solid var(--pri);background:rgba(255,255,255,.9);font-family:"Segoe Print","Comic Sans MS",system-ui,sans-serif;line-height:1.25;resize:none;overflow:hidden;z-index:5}
/* toolbar */
#tools{display:flex;flex-direction:column;gap:6px;padding:8px}
.tool{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tool b{font-size:24px;font-weight:400;line-height:1}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* options */
#opts .sec{margin-bottom:14px}
#opts h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swb{aspect-ratio:1;min-height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swb.on{box-shadow:0 0 0 3px var(--pri)}
.wheelbtn{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.wheelbox{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
#wheel{width:180px;height:180px;border-radius:50%;touch-action:none;cursor:crosshair}
.wheelbox label{width:100%;font-size:13px;color:var(--mut)}
.wheelbox input[type=range],#opts input[type=range]{width:100%}
.hexrow{display:flex;gap:8px;width:100%}
#chip{width:44px;border-radius:8px;border:1px solid var(--line)}
#hex{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;text-transform:lowercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:48px;padding:6px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt.on{border-color:var(--pri);box-shadow:0 0 0 2px #bfdbfe;background:#eff6ff}
.opt i{display:block;width:80%;border-radius:99px}
.opt b{font-size:22px;font-weight:400;line-height:1}
#opts .seg{width:100%}#opts .seg button{flex:1;padding:8px 4px}
.hint{color:var(--mut)}.hint b{color:var(--ink);display:block;font-size:17px;margin-bottom:4px}

.tool{min-height:60px}
@media(max-width:760px){#ur{left:12px;transform:none;bottom:72px}#zoom{bottom:72px}#mini{bottom:134px}}
@media(max-width:560px){#zoom input{display:none}}
@media(max-width:520px){#drawer{width:100%}#qbox{font-size:17px}#zoom input{width:70px}}
</style>
</head>
<body>
<main>
 <div id="join">
  <form class="card" id="jf">
   <h1 style="margin:0 0 4px">Join class</h1>
   <p style="color:var(--mut);margin:0 0 12px">Type your class code and first name</p>
   <input id="code" maxlength="10" placeholder="CODE" aria-label="Class code" autocomplete="off">
   <input id="name" maxlength="20" placeholder="Your first name" aria-label="First name" autocomplete="off">
   <p id="err" role="alert"></p>
   <button class="btn" style="width:100%">Join</button>
  </form>
 </div>

 <div id="play" hidden>
  <div id="stage">
   <canvas id="cv"></canvas>
   <textarea id="ed" maxlength="300" aria-label="Type your text"></textarea>
   <div class="ov lockable" id="selbar" hidden><button class="del" data-a="del" aria-label="Delete">🗑</button><button data-a="dup" aria-label="Duplicate">⧉</button><button data-a="front" aria-label="Bring to front">⬆</button></div>
   <div id="mini" hidden title="Where you are on the page"><div id="mv"></div></div>
  </div>
  <div id="qbox"><span id="q"></span><button id="qt" aria-label="Show or hide the question"></button></div>
  <div id="lockmsg" hidden>Your work is on the projector. Hold on for a moment…</div>
  <div id="quick" class="lockable"><span style="font-size:20px">✏️</span><button class="swb" style="background:#111111" data-qc="#111111" aria-label="Black"></button><button class="swb" style="background:#2563eb" data-qc="#2563eb" aria-label="Blue"></button><button class="swb" style="background:#dc2626" data-qc="#dc2626" aria-label="Red"></button><button class="swb" style="background:#059669" data-qc="#059669" aria-label="Green"></button></div>
  <button id="toolsbtn" aria-label="Open tools"><b>⬚</b>Tools<i></i></button>
  <div class="ov lockable" id="ur"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button></div>
  <div class="ov" id="zoom"><span>🔍</span><button data-z="-1" aria-label="Zoom out">−</button><input type="range" id="zs" min="100" max="600" step="10" value="100" aria-label="Zoom"><button data-z="1" aria-label="Zoom in">+</button><span id="zv">100%</span><button class="fit" data-z="0">Fit</button><span class="dot" id="dot" title="Connection"></span></div>
  <aside id="drawer" aria-label="Tools">
   <div id="dhead"><b>Tools</b><button id="pin">📌 Keep open</button><button id="dclose" aria-label="Close tools">✕ Close</button></div>
   <div id="dbody">
    <div class="card lockable" id="tools">
     <button class="tool on" data-t="select"><b>⬚</b>Select</button>
     <button class="tool" data-t="hand"><b>✋</b>Move view</button>
     <button class="tool" data-t="pen"><b>✏️</b>Draw</button>
     <button class="tool" data-t="eraser"><b>⌫</b>Eraser</button>
     <button class="tool" data-t="text"><b>T</b>Text</button>
     <button class="tool" data-t="shape"><b>◇</b>Shapes</button>
    </div>
    <div class="card lockable" id="opts"></div>
   </div>
  </aside>
 </div>
</main>
<script src="/common.js"></script>
<script>
let target = null, id = null;
const sp = new URLSearchParams(location.search);
$('#code').value = (sp.get('code') || localStorage.do_code || '').toUpperCase();
$('#name').value = localStorage.do_name || '';

const ws = connect(onmsg, () => target && sendJoin(), ok => {
  $('#dot').classList.toggle('ok', ok); $('#dot').title = ok ? 'Connected' : 'Reconnecting…';
});
function sendJoin() { ws.send({ t: 'join', code: target.code, name: target.name, id, objs, have: loaded, bw: target.bw, bh: target.bh }); }

$('#jf').onsubmit = e => {
  e.preventDefault(); $('#err').textContent = '';
  const code = $('#code').value.trim().toUpperCase(), name = $('#name').value.trim();
  if (!code || !name) return ($('#err').textContent = 'Type the code and your name');
  localStorage.do_code = code; localStorage.do_name = name;
  id = sessionStorage['do_id_' + code] || null;
  target = { code, name, bw: Math.min(3000, Math.max(300, Math.round(innerWidth - 24))), bh: Math.min(3000, Math.max(300, Math.round(innerHeight - 140))) }; sendJoin(); // the page is the size of this screen
};

function setQ(nq) {
  q = nq; $('#q').innerHTML = q.question || 'Waiting for your teacher’s question…'; // server-sanitized: only b/i/u/br
  im = loadImg(q.img, draw); draw();
}
function applyLock(proj) { // work on the projector can't be changed
  locked = proj; if (proj) { commitEdit(true); sel = null; cur = null; g = null; }
  document.body.classList.toggle('locked', proj); $('#lockmsg').hidden = !proj; if (proj) openDrawer(false); all();
}

function onmsg(m) {
  if (m.t === 'err') {
    if ($('#play').hidden) $('#err').textContent = m.m;
    else if (m.nocls) setTimeout(sendJoin, 3000); // server restarted: keep retrying until the teacher is back
  } else if (m.t === 'joined') {
    id = m.id; sessionStorage['do_id_' + target.code] = id; W = m.bw; H = m.bh;
    $('#join').hidden = true; $('#play').hidden = false; document.body.classList.add('playing');
    if (m.q.question || m.q.img || !$('#q').innerHTML) setQ(m.q);
    if (!loaded && !objs.length && m.objs.length) resetDoc(m.objs); // page was refreshed: get the drawing back
    loaded = true; applyLock(!!m.proj); applySimple(!!m.simple);
  } else if (m.t === 'lock') applyLock(!!m.proj);
  else if (m.t === 'mode') applySimple(!!m.simple);
  else if (m.t === 'kicked') { // teacher cleared the class
    sessionStorage.removeItem('do_id_' + target.code); target = id = null; loaded = false; resetDoc([]); applyLock(false);
    $('#play').hidden = true; $('#join').hidden = false; document.body.classList.remove('playing'); $('#err').textContent = 'Class ended. Join again when your teacher says so.';
  } else if (m.t === 'q') { setQ(m.q); resetDoc([]); }
}


const cv=$('#cv'),cx=cv.getContext('2d'),ed=$('#ed'),opts=$('#opts'),bar=$('#selbar'),mini=$('#mini');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const COLORS=['#111111','#6b7280','#dc2626','#f97316','#facc15','#22c55e','#059669','#06b6d4','#2563eb','#7c3aed','#db2777','#92400e'];
const SHAPES={rect:'▭',ellipse:'◯',tri:'△',diamond:'◇',star:'☆'},LINES={line:'╱',arrow:'➚'};
const HF={nw:[0,0],n:[.5,0],ne:[1,0],e:[1,.5],se:[1,1],s:[.5,1],sw:[0,1],w:[0,.5]};
let S={erase:'whole',esize:20,pin:false,tool:'select',color:'#111111',size:4,pen:'pen',dash:'solid',fill:'none',shape:'rect',text:32,wheel:false,hsv:[220,.85,.93]};
let uid=1;const nid=()=>uid++;
let objs=[],synced=new Map(),loaded=false;
let sel=null,editing=null,g=null,cur=null,locked=false,lastTap={id:0,t:0};
let V={z:1,ox:0,oy:0},hist=['[]'],hi=0,q={question:'',bg:'graph',img:null},im=null;

/* ---------- geometry ---------- */
const PAD={l:12,r:12,t:76,b:64}; // space kept free around the page for the floating controls
const aw=()=>cv.clientWidth-PAD.l-PAD.r, ah=()=>cv.clientHeight-PAD.t-PAD.b;
const base=()=>Math.min(aw()/W,ah()/H), sc=()=>base()*V.z;
const toScr=(x,y)=>[(x-V.ox)*sc()+PAD.l,(y-V.oy)*sc()+PAD.t];
const css=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const toWorld=c=>[clamp((c[0]-PAD.l)/sc()+V.ox,0,W),clamp((c[1]-PAD.t)/sc()+V.oy,0,H)];
const clone=o=>JSON.parse(JSON.stringify(o));
function clampView(){V.z=clamp(V.z,1,6);const vw=aw()/sc(),vh=ah()/sc();V.ox=vw>=W?(W-vw)/2:clamp(V.ox,0,W-vw);V.oy=vh>=H?(H-vh)/2:clamp(V.oy,0,H-vh)}
function setZoom(z,ax=.5,ay=.5){const vw0=aw()/sc(),vh0=ah()/sc(),wx=V.ox+ax*vw0,wy=V.oy+ay*vh0;V.z=clamp(z,1,6);const vw=aw()/sc(),vh=ah()/sc();V.ox=wx-ax*vw;V.oy=wy-ay*vh;clampView();draw();ui()}

function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=clamp(t,0,1);return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function near(o,p,t){
 if(o.k==='stroke'||o.k==='line'){const r=ew(o)/2+t;if(o.pts.length===1)return Math.hypot(p[0]-o.pts[0][0],p[1]-o.pts[0][1])<=r;
  for(let i=1;i<o.pts.length;i++)if(segDist(p,o.pts[i-1],o.pts[i])<=r)return true;return false}
 const b=bbox(o);if(p[0]<b.x-t||p[0]>b.x+b.w+t||p[1]<b.y-t||p[1]>b.y+b.h+t)return false;
 if(o.k==='text'||o.fill!=='none')return true;
 const m=Math.min(p[0]-b.x,b.x+b.w-p[0],p[1]-b.y,b.y+b.h-p[1]);return m<=t+o.lw/2||Math.min(b.w,b.h)<2*t;
}
const hit=p=>{for(let i=objs.length-1;i>=0;i--)if(near(objs[i],p,14/sc()))return objs[i]};
function moveBy(o,s,dx,dy){if(o.pts)o.pts=s.pts.map(p=>[p[0]+dx,p[1]+dy]);else{o.x=s.x+dx;o.y=s.y+dy}}
function applyBox(o,s,ob,n,corner){
 if(o.k==='shape'){Object.assign(o,{x:n.x,y:n.y,w:n.w,h:n.h})}
 else if(o.k==='text'){o.x=n.x;o.y=n.y;o.w=n.w;if(corner)o.size=Math.max(10,s.size*n.w/ob.w)}
 else{const sx=n.w/Math.max(ob.w,1),sy=n.h/Math.max(ob.h,1);o.pts=s.pts.map(p=>[n.x+(p[0]-ob.x)*sx,n.y+(p[1]-ob.y)*sy])}
}
const inside=(o,b)=>{const k=(o.k==='text'||o.k==='shape')?0:8;return b.x>=-k&&b.y>=-k&&b.x+b.w<=W+k&&b.y+b.h<=H+k};
function fit(o){if(o.k!=='text')return;const b=bbox(o);o.x=clamp(o.x,0,W-o.w);o.y=clamp(o.y,0,Math.max(0,H-b.h))}

/* ---------- drawing ---------- */
const paint=o=>drawOp(cx,o);
const handleList=o=>(o.k==='text'?['nw','ne','sw','se','w','e']:Object.keys(HF)).map(id=>{const b=bbox(o),f=HF[id],[x,y]=toScr(b.x+f[0]*b.w,b.y+f[1]*b.h);return{id,x,y}});
function draw(){
 if(!cv.clientWidth)return;
 const d=devicePixelRatio||1,k=sc()*d;
 cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
 cx.fillStyle='#d1d5db';cx.fillRect(0,0,cv.width,cv.height);
 cx.setTransform(k,0,0,k,(PAD.l-V.ox*sc())*d,(PAD.t-V.oy*sc())*d);cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();
 paintBg(cx,q.bg,im);
 objs.forEach(o=>{if(o!==editing)paint(o)});if(cur)paint(cur);cx.restore();
 cx.setTransform(d,0,0,d,0,0);
 if(S.tool==='eraser'&&S.erase==='part'&&ptrCss&&!locked){cx.beginPath();cx.arc(ptrCss[0],ptrCss[1],S.esize,0,7);cx.fillStyle='#ffffff99';cx.fill();cx.lineWidth=2;cx.strokeStyle='#111';cx.stroke()}
 if(sel&&!locked){
  const b=bbox(sel),[x,y]=toScr(b.x,b.y);
  cx.strokeStyle='#2563eb';cx.lineWidth=2;cx.setLineDash([6,4]);cx.strokeRect(x-3,y-3,b.w*sc()+6,b.h*sc()+6);cx.setLineDash([]);
  if(!editing)handleList(sel).forEach(h=>{cx.beginPath();cx.arc(h.x,h.y,9,0,7);cx.fillStyle='#fff';cx.fill();cx.lineWidth=3;cx.stroke()});
 }
}

/* ---------- history ---------- */
function commit(){
 const j=JSON.stringify(objs);if(j===hist[hi]){sync();return}
 hist.length=hi+1;hist.push(j);hi++;if(hist.length>100){hist.shift();hi--}sync();
}
function restore(){const id=sel&&sel.id;commitEdit(true);objs=JSON.parse(hist[hi]);sel=objs.find(o=>o.id===id)||null;sync();all()}
const undo=()=>{if(hi>0){hi--;restore()}},redo=()=>{if(hi<hist.length-1){hi++;restore()}};
function del(){if(!sel)return;objs=objs.filter(o=>o!==sel);sel=null;commit();all()}

/* ---------- text editing ---------- */
function posEd(){
 const o=editing;if(!o)return;const[x,y]=toScr(o.x,o.y);
 Object.assign(ed.style,{display:'block',left:x+'px',top:y+'px',width:o.w*sc()+'px',fontSize:o.size*sc()+'px',color:o.c});
 ed.style.height='0';ed.style.height=ed.scrollHeight+'px';
}
function startEdit(o,fresh){editing=o;ed.dataset.before=fresh?'':o.t;ed.value=o.t;posEd();draw()} // focus happens on pointer-up (see up): focusing during pointer-down gets stolen by the browser
function commitEdit(quiet){
 const o=editing;if(!o)return;editing=null;ed.style.display='none';o.t=ed.value.trim();
 if(!o.t){objs=objs.filter(x=>x!==o);if(sel===o)sel=null}
 if(!quiet&&o.t!==(ed.dataset.before||''))commit();
 all();
}
ed.oninput=()=>{editing.t=ed.value;fit(editing);posEd();draw();selBar();if(editing.t.trim())sync()};
ed.onkeydown=e=>{if(e.key==='Escape')commitEdit()};
ed.onblur=()=>commitEdit();

/* ---------- pointer handling ---------- */
const ptrs=new Map();let pinch=null;
cv.onpointerdown=e=>{
 if(locked)return;commitEdit();try{cv.setPointerCapture(e.pointerId)}catch{}ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size===2){const[a,b]=[...ptrs.values()],m=css({clientX:(a[0]+b[0])/2,clientY:(a[1]+b[1])/2});
  if(cur){ws.send({t:'del',oid:cur.id});pend=[]}g=null;cur=null;pinch={d0:Math.hypot(a[0]-b[0],a[1]-b[1]),z0:V.z,w:[(m[0]-PAD.l)/sc()+V.ox,(m[1]-PAD.t)/sc()+V.oy]};return}
 if(ptrs.size>2)return;down(e);
};
let ptrCss=null; // pointer position, for the partial-eraser ring
cv.onpointermove=e=>{
 if(S.tool==='eraser'){ptrCss=css(e);draw()}

 objs.forEach(o=>{const j=JSON.stringify(o);if(synced.get(o.id)!==j){ws.send({t:'set',o});synced.set(o.id,j)}});
}
let pend=[],pendId=0,pendT=0;
function streamPts(o,p){ // live pen strokes: batch new points ~15 times a second
 pend.push(p);pendId=o.id;if(pendT)return;
 pendT=setTimeout(()=>{pendT=0;if(pend.length)ws.send({t:'pts',oid:pendId,p:pend});pend=[]},70);
}
function resetDoc(list){
 commitEdit(true);objs=list;sel=null;cur=null;g=null;hist=[JSON.stringify(objs)];hi=0;
 synced=new Map(objs.map(o=>[o.id,JSON.stringify(o)]));uid=Math.max(uid,...objs.map(o=>o.id+1),1);V={z:1,ox:0,oy:0};all();
}

new ResizeObserver(()=>{const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;clampView();all(true)}).observe(cv);
renderOpts();
