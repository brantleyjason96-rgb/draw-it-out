<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw It Out</title>
<link rel="stylesheet" href="/style.css">
<style>
#join .card{max-width:380px;margin:40px auto;text-align:center}
#join input{width:100%;padding:12px;font-size:20px;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;text-align:center}
#join #code{letter-spacing:.3em;text-transform:uppercase}
#err{color:#b91c1c;min-height:1.4em;margin:0 0 8px}
.stack{display:grid;position:relative;width:min(100%,calc((100vh - 280px)*1.6));margin:auto}
.stack canvas{grid-area:1/1}
#pad{touch-action:none;cursor:crosshair;background:transparent;border-color:transparent}
#pv{pointer-events:none;background:transparent;border-color:transparent}
#ti{position:absolute;display:none;min-width:140px;padding:0;margin:0;border:1px dashed var(--pri);background:rgba(255,255,255,.85);font-family:"Segoe Print","Comic Sans MS",system-ui,sans-serif;outline:none;z-index:2}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--pri)}
.btn.sm{padding:8px 12px;min-height:44px}
#tools.locked{opacity:.45;pointer-events:none}
#lockmsg{background:#92400e;font-size:18px;margin:0 0 10px}
</style>
</head>
<body>
<main>
 <div id="join">
  <form class="card" id="jf">
   <h1 style="margin:0 0 4px">Join class</h1>
   <p style="color:var(--mut);margin:0 0 12px">Type your class code and first name</p>
   <input id="code" maxlength="10" placeholder="CODE" aria-label="Class code" autocomplete="off">
   <input id="name" maxlength="20" placeholder="Your first name" aria-label="First name" autocomplete="off">
   <p id="err" role="alert"></p>
   <button class="btn" style="width:100%">Join</button>
  </form>
 </div>

 <div id="play" hidden>
  <div class="qbar" id="q"></div>
  <div class="card">
   <div id="lockmsg" class="qbar" hidden></div>
   <div class="row" id="tools" style="margin-bottom:10px">
    <span class="swatch on" style="background:#111" data-c="#111111" aria-label="Black"></span>
    <span class="swatch" style="background:#2563eb" data-c="#2563eb" aria-label="Blue"></span>
    <span class="swatch" style="background:#dc2626" data-c="#dc2626" aria-label="Red"></span>
    <span class="swatch" style="background:#059669" data-c="#059669" aria-label="Green"></span>
    <button class="btn alt sm tool on" data-t="pen">✏️ Pen</button>
    <button class="btn alt sm tool" data-t="eraser">Eraser</button>
    <button class="btn alt sm tool" data-t="text">T Text</button>
    <button class="btn alt sm tool" data-t="rect" aria-label="Rectangle">▭</button>
    <button class="btn alt sm tool" data-t="ellipse" aria-label="Circle">◯</button>
    <button class="btn alt sm tool" data-t="line" aria-label="Line">╱</button>
    <button class="btn alt sm tool" data-t="arrow" aria-label="Arrow">➚</button>
    <button class="btn alt sm" id="undo">Undo</button>
    <button class="btn alt sm" id="clear">Clear</button>
   </div>
   <div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn" id="done">I'm done ✓</button></div>
   <div class="stack">
    <canvas id="bg" width="800" height="500"></canvas>
    <canvas id="pad" width="800" height="500"></canvas>
    <canvas id="pv" width="800" height="500"></canvas>
    <input id="ti" maxlength="200" aria-label="Type your text, then press Enter" autocomplete="off">
   </div>
   <p style="color:var(--mut);margin:8px 0 0"><span class="dot" id="dot"></span><span id="st">Connecting…</span> · Your teacher can see your drawing live.</p>
  </div>
 </div>
</main>
<script src="/common.js"></script>
<script>
const pad = $('#pad'), pv = $('#pv'), ti = $('#ti'), layer = pad; // the visible pad is the drawing layer itself
let target = null, id = null, ops = [], q = { question: '', bg: 'graph', img: null }, im = null;
let col = '#111111', tool = 'pen', cur = null, start = null, last = null, k = 0, tpos = null;
let lock = { done: false, proj: false };
const locked = () => lock.done || lock.proj;

const sp = new URLSearchParams(location.search);
$('#code').value = (sp.get('code') || localStorage.do_code || '').toUpperCase();
$('#name').value = localStorage.do_name || '';

const ws = connect(onmsg, () => target && sendJoin(), ok => {
  $('#dot').classList.toggle('ok', ok); $('#st').textContent = ok ? 'Connected' : 'Reconnecting…';
});
function sendJoin() { ws.send({ t: 'join', code: target.code, name: target.name, id, ops }); }

$('#jf').onsubmit = e => {
  e.preventDefault(); $('#err').textContent = '';
  const code = $('#code').value.trim().toUpperCase(), name = $('#name').value.trim();
  if (!code || !name) return ($('#err').textContent = 'Type the code and your name');
  localStorage.do_code = code; localStorage.do_name = name;
  id = sessionStorage['do_id_' + code] || null;
  target = { code, name }; sendJoin();
};

function setQ(nq) {
  q = nq; $('#q').innerHTML = q.question || 'Waiting for your teacher’s question…'; // server-sanitized: only b/i/u/br
  im = loadImg(q.img, drawBg); drawBg();
}
const drawBg = () => paintBg($('#bg').getContext('2d'), q.bg, im);

function applyLock() {
  const l = locked(); if (l) cancelText();
  $('#tools').classList.toggle('locked', l); $('#lockmsg').hidden = !l;
  $('#lockmsg').textContent = lock.done ? 'Submitted ✓ Ask your teacher to reopen it if you need to add something.' : 'Your work is on the projector. Hold on for a moment…';
  $('#done').disabled = lock.done; $('#done').textContent = lock.done ? 'Submitted ✓' : "I'm done ✓";
  pad.style.cursor = l ? 'not-allowed' : 'crosshair';
}

function onmsg(m) {
  if (m.t === 'err') {
    if ($('#play').hidden) $('#err').textContent = m.m;
    else if (m.nocls) setTimeout(sendJoin, 3000); // server restarted: keep retrying until the teacher is back
  } else if (m.t === 'joined') {
    id = m.id; sessionStorage['do_id_' + target.code] = id;
    $('#join').hidden = true; $('#play').hidden = false;
    if (m.q.question || m.q.img) setQ(m.q); else if (!$('#q').innerHTML) setQ(m.q);
    if (!ops.length && m.ops.length) { ops = m.ops; replay(layer, ops); } // page was refreshed: get the drawing back
    k = Math.max(k, ...ops.map(o => o.k), 0);
    lock = { done: !!m.done, proj: !!m.proj }; applyLock();
  } else if (m.t === 'lock') {
    lock = { done: !!m.done, proj: !!m.proj }; applyLock();
  } else if (m.t === 'kicked') { // teacher cleared the class
    cancelText(); sessionStorage.removeItem('do_id_' + target.code); target = id = null; ops = []; k = 0; replay(layer, ops);
    lock = { done: false, proj: false }; applyLock(); $('#play').hidden = true; $('#join').hidden = false;
    $('#err').textContent = 'Class ended. Join again when your teacher says so.';
  } else if (m.t === 'q') {
    ops = []; k = 0; replay(layer, ops); setQ(m.q);
  }
}

// ---- drawing: pen/eraser stream live; shapes and text are sent when finished ----
const pt = e => { const r = pad.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * W / r.width), Math.round((e.clientY - r.top) * H / r.height)]; };
function add(o) { ops.push(o); drawOp(pad.getContext('2d'), o); ws.send({ t: 'd', o }); }
const mkOp = (a, b) => ({ k, c: col, w: tool === 'eraser' ? 30 : 4, e: tool === 'eraser', s: ['rect', 'ellipse', 'line', 'arrow'].includes(tool) ? tool : undefined, a, b });
const isShape = () => !['pen', 'eraser', 'text'].includes(tool);

pad.onpointerdown = e => {
  if (locked()) return;
  if (tool === 'text') { e.preventDefault(); return openText(e, pt(e)); }
  commitText(); pad.setPointerCapture(e.pointerId);
  k++; cur = start = last = pt(e);
  if (!isShape()) add(mkOp(cur, cur));
};
pad.onpointermove = e => {
  if (!cur) return; const p = last = pt(e);
  if (isShape()) { const x = pv.getContext('2d'); x.clearRect(0, 0, W, H); drawOp(x, mkOp(start, p)); }
  else { add(mkOp(cur, p)); cur = p; }
};
pad.onpointerup = pad.onpointercancel = e => {
  if (!cur) return;
  if (isShape()) {
    pv.getContext('2d').clearRect(0, 0, W, H);
    const p = e.type === 'pointerup' ? pt(e) : last;
    if (Math.hypot(p[0] - start[0], p[1] - start[1]) > 4) add(mkOp(start, p));
  }
  cur = null;
};

// text box: tap where you want it, type, press Enter (or tap elsewhere)
function openText(e, p) {
  commitText(); const r = pad.getBoundingClientRect(), s = r.width / W;
  Object.assign(ti.style, { left: (e.clientX - r.left) + 'px', top: (e.clientY - r.top) + 'px', fontSize: 32 * s + 'px', color: col, display: 'block' });
  ti.value = ''; tpos = p; setTimeout(() => ti.focus(), 0);
}
function commitText() {
  if (!tpos) return; const v = ti.value.trim(), p = tpos; cancelText();
  if (v && !locked()) { k++; add({ k, c: col, w: 32, tx: v, a: p, b: p }); }
}
function cancelText() { tpos = null; ti.style.display = 'none'; ti.value = ''; }
ti.onkeydown = e => { if (e.key === 'Enter') commitText(); else if (e.key === 'Escape') cancelText(); };
ti.onblur = commitText;

// toolbar
document.querySelectorAll('.swatch').forEach(s => s.onclick = () => {
  col = s.dataset.c; if (tool === 'eraser') setTool('pen');
  document.querySelectorAll('.swatch').forEach(o => o.classList.toggle('on', o === s));
});
function setTool(t) { commitText(); tool = t; document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.t));
$('#undo').onclick = () => { commitText(); ops = dropLast(ops); replay(layer, ops); ws.send({ t: 'undo' }); };
$('#clear').onclick = () => { commitText(); ops = []; replay(layer, ops); ws.send({ t: 'clear' }); };
$('#done').onclick = () => {
  if (!confirm('Submit your work? Only your teacher can reopen it.')) return;
  commitText(); lock.done = true; applyLock(); ws.send({ t: 'done', v: true });
};
</script>
</body>
</html>
