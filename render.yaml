# Deploy on Render (https://render.com): New + > Blueprint > pick this repo.
# Starter plan (about $7 a month): always awake, so a class never meets a sleeping server.
# The free plan sleeps after ~15 minutes without traffic, and a restart drops every live class, which is not OK once teachers rely on this.
# Keep it at ONE instance: live classes are held in memory, so a second instance would not see them (do not turn on autoscaling).
services:
  - type: web
    name: draw-it-out
    runtime: docker
    plan: starter        # was "free"; syncing this blueprint on Render starts the paid plan
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY   # the per-address connection cap reads the address Render's proxy appended to X-Forwarded-For
        value: "1"
      - key: MAX_ROOMS
        value: "300"
