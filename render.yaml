# Deploy on Render (https://render.com): New + > Blueprint > pick this repo.
# Free plan: the service sleeps after ~15 minutes without traffic and takes up to a minute to wake.
# Keep it at ONE instance either way: live classes are held in memory, so a second instance would not see them.
services:
  - type: web
    name: draw-it-out
    runtime: docker
    plan: free           # change to "starter" (about $7/mo) if you want it always awake
    healthCheckPath: /healthz
    envVars:
      - key: MAX_ROOMS
        value: "300"
