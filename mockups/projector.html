<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projector mock-up</title>
<style>
/* Mock-up of the projector (public/projector.html), all views. Colours come from public/tokens.css.
   Fonts are the app's own files, loaded by relative path, so this file works from the repo with no network.
   Everything inside .screen is the design. Everything inside .mock is a mock-up control and is not part of the design. */
@font-face{font-family:'Figtree';font-weight:400 800;src:url(../public/fonts/figtree-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(../public/fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:dark;
--stage:#0B1220;--stage-2:#141D30;--stage-3:#1E2A42;--stage-ink:#E2E8F0;--stage-accent:#93C5FD;--stage-mut:#A9B6CA;
--good-on-dark:#3DD68C;--warn-on-dark:#FBBF24;--bad-on-dark:#F87171;
--frost:#0C4A6E;--frost-soft:#E0F2FE;--note:#FDE68A;--primary:#0B6BCB;
--font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
--warn-soft:#FFF4DC;--warn-line:#F0D79A;--warn-strong:#5E4300}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#05080F;font-family:var(--font);color:var(--stage-ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--stage-accent);outline-offset:2px}

/* ---------- mock-up controls ---------- */
.mock{flex:none;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--warn-soft);border-bottom:2px dashed var(--warn-line);color:var(--warn-strong);font-size:14px}
.mock b{font-weight:700}
.mock .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #76838F;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 10px;min-height:34px;font-weight:600;font-size:14px;color:#17212B}
.seg button+button{border-left:1px solid #E1E6EB}
.seg button[aria-pressed=true]{background:#17212B;color:#fff}
.mbtn{border:1px solid #76838F;border-radius:8px;background:#fff;color:#17212B;padding:6px 10px;min-height:34px;font-weight:600;font-size:14px}
.room{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.fit{position:relative;flex:none}

/* ---------- the projector screen ---------- */
.screen{container-type:size;position:absolute;left:0;top:0;transform-origin:0 0;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;overflow:hidden;font-size:clamp(20px,2.6cqh,34px)}
.q{flex:none;text-align:center;padding:2.2cqh 4cqw 1.4cqh;font-size:clamp(34px,min(3cqw,5cqh),54px);line-height:1.22;font-weight:500;overflow-wrap:anywhere}
.q b{font-weight:800}
.q.big{font-size:clamp(34px,min(3.6cqw,6cqh),64px)}
.stagebody{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 4cqw 2cqh}

/* footer: on every view. The question keeps the full width. */
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 3cqw;height:7.2cqh;min-height:56px;background:var(--stage-2);border-top:1px solid var(--stage-3);font-size:clamp(20px,2.7cqh,30px)}
.logo{display:flex;align-items:center;gap:1cqw;font-family:var(--font-display);font-weight:700;font-size:1.05em;color:#fff}
.logo svg{height:1.5em;width:1.5em;flex:none}
.joinline{color:var(--stage-mut)}
.joinline b{color:#fff;font-weight:800;letter-spacing:.14em;margin-left:.3em;font-size:1.12em}
.joinline .site{color:var(--stage-ink);font-weight:600}

/* join */
.join{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(24px,6cqw,110px);padding:0 4cqw 2cqh}
.join .jl{text-align:center;font-size:clamp(24px,3cqw,40px)}
.join .jl b{display:block;font-family:var(--font-display);font-size:2.6em;letter-spacing:.14em;color:#fff;line-height:1.1;margin-top:.1em}
.join .jr{text-align:center}
.qr{width:clamp(200px,min(26cqw,46cqh),440px);height:clamp(200px,min(26cqw,46cqh),440px);background:#fff;border-radius:12px;padding:6px}
.qr canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.jcap{font-size:clamp(22px,2cqw,32px);margin-top:10px;color:var(--stage-accent)}

/* one drawing and compare: tiles fill the height under the question */
.tiles{flex:1;min-height:0;display:grid;gap:1.6cqw}
.tiles.three{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.tiles.three .tile:nth-child(3){grid-column:1/-1;justify-self:center;width:calc(50% - .8cqw)}
.tile{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--stage-2);border-radius:14px;overflow:hidden;border:2px solid var(--stage-3)}
.tile .lab{flex:none;display:flex;align-items:center;gap:.6em;padding:.45em .8em;font-weight:700;font-size:clamp(20px,2.7cqh,30px);background:var(--stage-3);min-width:0}
.tile .lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .lab .pc{margin-left:auto;flex:none;font-weight:700;font-size:.82em;padding:.1em .6em;border-radius:99px;white-space:nowrap}
.pc.g{background:#E6F4EC;color:#0A5A36}.pc.y{background:#FFF4DC;color:#5E4300}.pc.r{background:#FBE4E1;color:#8C1D18}
.tile .art{flex:1;min-height:0;background:var(--stage-3);display:flex}
.tile canvas{width:100%;height:100%;display:block;object-fit:contain}

/* leaderboard: one bar per team */
.lb{flex:1;min-height:0;position:relative;margin-top:.4cqh}
.row{position:absolute;left:0;right:0;height:calc(100% / var(--n) - 1.4cqh);top:calc(var(--i) * 100% / var(--n));display:flex;align-items:center;border-radius:14px;background:var(--stage-2);overflow:hidden;transition:top .7s cubic-bezier(.2,.9,.3,1)}
.row .fill{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--tc);transition:width .7s cubic-bezier(.2,.9,.3,1);min-width:0}
.row .in{position:relative;z-index:1;display:flex;align-items:center;width:100%;gap:1.4cqw;padding:0 1.2cqw}
.plate{display:flex;align-items:center;gap:.7em;background:rgba(11,18,32,.92);color:#fff;border-radius:99px;padding:0 1.1em;height:78%;min-height:0;font-weight:800;font-size:clamp(34px,5.6cqh,60px);line-height:1;white-space:nowrap}
.plate .rk{display:grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:#fff;color:#0B1220;font-size:.8em}
.plate .em{font-size:1em}
.row .sp{flex:1}
.plate.sc{font-family:var(--font-display);font-size:clamp(34px,6.4cqh,68px);padding:0 .9em;font-variant-numeric:tabular-nums}
.crown{display:inline-flex;margin-left:.1em}
.crown svg{width:1em;height:1em;fill:none;stroke:var(--warn-on-dark);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lbnote{flex:none;text-align:center;font-size:clamp(28px,4cqh,46px);font-weight:700;color:var(--stage-accent);padding:1.2cqh 0 0}
.lb.even .row .fill{width:100%;opacity:.28}

/* sort results: one neutral colour, no red, no green */
.res{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.res>div{display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.res h2{margin:0;font-size:clamp(30px,4.6cqh,52px);font-weight:800;color:var(--stage-accent)}
.res .meta{font-weight:500;color:var(--stage-mut);font-size:.7em;margin-left:.5em}
.bar{margin:0}
.bar .t{display:flex;align-items:center;gap:.5em;font-size:clamp(26px,4.2cqh,46px);font-weight:600;margin-bottom:.35cqh}
.bar .t .ok{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--stage-accent);color:#0B1220;flex:none}
.bar .t .ok svg{width:.9em;height:.9em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bar .trk{display:flex;align-items:center;gap:1cqw}
.bar .b{flex:1;height:3.8cqh;min-height:20px;border-radius:99px;background:var(--stage-3);overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--stage-accent);border-radius:99px}
.bar .pct{width:3.2em;text-align:right;font-weight:800;font-size:clamp(32px,5.4cqh,60px);font-variant-numeric:tabular-nums}
.bar.best .b i{background:#fff}

/* frozen */
.frz{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--frost);overflow:hidden}
.frz .fi{font-size:clamp(90px,18cqh,200px);line-height:1}
.frz b{font-family:var(--font-display);font-size:clamp(48px,10cqh,110px);color:var(--frost-soft);margin-top:1cqh}
.frz p{margin:1cqh 0 0;font-size:clamp(28px,5cqh,56px);color:var(--frost-soft);font-weight:500}
.flake{position:absolute;top:-10%;color:var(--frost-soft);opacity:.45;font-size:clamp(20px,4cqh,44px);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(125cqh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flake{display:none}.row,.row .fill{transition:none}}

/* waiting between questions */
.wait{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2cqh}
.wait .cn{font-family:var(--font-display);font-size:clamp(60px,14cqh,150px);line-height:1.05;color:#fff}
.wait p{margin:0;font-size:clamp(28px,4.6cqh,52px);color:var(--stage-accent);font-weight:600}
.wait .jbig{font-size:clamp(28px,4cqh,46px);color:var(--stage-ink)}
.wait .jbig b{font-family:var(--font-display);letter-spacing:.14em;font-size:1.5em;color:#fff;margin-left:.25em}
</style>
</head>
<body>

<div class="mock" role="group" aria-label="Mock-up controls">
 <span><b>Mock-up.</b> Projector, all views. Pick a view:</span>
 <span class="seg" id="views" role="group" aria-label="View">
  <button data-v="join" aria-pressed="true">Join</button>
  <button data-v="one" aria-pressed="false">One drawing</button>
  <button data-v="compare" aria-pressed="false">Compare 3</button>
  <button data-v="lb" aria-pressed="false">Leaderboard</button>
  <button data-v="lb0" aria-pressed="false">Leaderboard, no points</button>
  <button data-v="sort" aria-pressed="false">Sort results</button>
  <button data-v="frozen" aria-pressed="false">Frozen</button>
  <button data-v="wait" aria-pressed="false">Waiting</button>
 </span>
 <span class="grp">Preview at
  <span class="seg" id="sizes" role="group" aria-label="Screen size">
   <button data-s="1366x768" aria-pressed="false">1366×768</button>
   <button data-s="1440x900" aria-pressed="true">1440×900</button>
   <button data-s="1920x1080" aria-pressed="false">1920×1080</button>
  </span>
 </span>
 <span class="grp">Question
  <span class="seg" id="qlen" role="group" aria-label="Question length">
   <button data-q="short" aria-pressed="true">Short</button>
   <button data-q="long" aria-pressed="false">Long (3 lines)</button>
  </span>
 </span>
 <span class="grp" id="lbctl" hidden>Teams
  <span class="seg" id="nteams" role="group" aria-label="Number of teams"><button data-n="4" aria-pressed="true">4</button><button data-n="8" aria-pressed="false">8</button></span>
  <button class="mbtn" id="addpt">Give the next team a point</button>
  <button class="mbtn" id="resetpt">Reset scores</button>
 </span>
 <span class="grp" id="namesctl" hidden><label><input type="checkbox" id="hidenames"> Names hidden</label></span>
</div>

<div class="room" id="room"><div class="fit" id="fit"><div class="screen" id="screen"></div></div></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const SITE = 'draw-it-out.onrender.com', CODE = 'YC4M';
const LOGO = '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1e3a8a"/><path d="M9 22.5c3-8 6-11 9-9s-1 7 5 2.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.4" fill="#fbbf24"/></svg>';
const CROWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const Q_SHORT = 'Draw a cross-section of Earth and <b>label the four layers</b>: crust, mantle, outer core, inner core.';
const Q_LONG = 'Draw a cross-section of Earth and <b>label the four layers</b>: crust, mantle, outer core, inner core. Then use an arrow to show where the heat that moves the plates comes from, and write one sentence about it.';
const Q_SORT = 'Sort each card into the <b>type of rock</b> it describes.';
const TEAMS = [
  { n: 'Granite', e: '🪨', c: '#475569' }, { n: 'Basalt', e: '🌋', c: '#B3261E' }, { n: 'Quartz', e: '💎', c: '#0284C7' }, { n: 'Magma', e: '🔥', c: '#EA580C' },
  { n: 'Forest', e: '🌲', c: '#0E7C4A' }, { n: 'Tide', e: '🌊', c: '#0891B2' }, { n: 'Comet', e: '☄️', c: '#7C3AED' }, { n: 'Dune', e: '🏜️', c: '#A16207' }];
const KIDS = [{ n: 'Maya', p: 'g' }, { n: 'Jin', p: 'y' }, { n: 'Amira', p: 'y' }];
const PW = { g: 'I understand', y: 'Almost', r: 'I need help' }, PE = { g: '💡', y: '🙂', r: '🙋' };
let S = { v: 'join', size: '1440x900', q: 'short', n: 4, hide: false, pts: [0, 0, 0, 0, 0, 0, 0, 0], nextPt: 0 };

/* stand-in drawings, drawn at random once: these are not real student work */
function art(cv, k) {
  const c = cv.getContext('2d'), w = cv.width = 640, h = cv.height = 400;
  c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
  c.strokeStyle = '#E4EEF7'; c.lineWidth = 1;
  for (let x = 0; x < w; x += 20) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
  for (let y = 0; y < h; y += 20) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  const L = [['#BFD4F7', '#2563eb', 150], ['#F6C0C0', '#dc2626', 112], ['#FAD3A8', '#f97316', 76], ['#CDBBF5', '#7c3aed', 42]];
  const n = [1, 4, 4][k % 3], rot = [0, .08, -.06][k % 3];
  L.slice(0, n).forEach(([f, s, r]) => { c.beginPath(); c.ellipse(w / 2, h / 2, r * 1.25, r, rot, 0, 7); c.fillStyle = f; c.globalAlpha = .75; c.fill(); c.globalAlpha = 1; c.strokeStyle = s; c.lineWidth = 3; c.stroke(); });
  c.fillStyle = '#17212B'; c.font = '600 22px Figtree, sans-serif';
  if (n > 1) { ['crust', 'mantle', 'outer core', 'inner core'].forEach((t, i) => c.fillText(t, w / 2 + 200 + (i % 2) * 6, h / 2 - 110 + i * 40)); c.strokeStyle = '#dc2626'; c.lineWidth = 3; c.beginPath(); c.moveTo(w / 2 + 190, h / 2 - 100); c.lineTo(w / 2 + 120, h / 2 - 60); c.stroke(); }
}
function qr(cv) { // stand-in, not a real QR code
  const n = 25, px = 10, c = cv.getContext('2d'); cv.width = cv.height = n * px; c.fillStyle = '#fff'; c.fillRect(0, 0, n * px, n * px); c.fillStyle = '#0B1220';
  let a = 7; const rnd = () => (a = (a * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (rnd() > .52) c.fillRect(x * px, y * px, px, px);
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([x, y]) => { c.fillStyle = '#fff'; c.fillRect((x - 0) * px, y * px, 7 * px, 7 * px); c.fillStyle = '#0B1220'; c.fillRect(x * px, y * px, 7 * px, 7 * px); c.fillStyle = '#fff'; c.fillRect((x + 1) * px, (y + 1) * px, 5 * px, 5 * px); c.fillStyle = '#0B1220'; c.fillRect((x + 2) * px, (y + 2) * px, 3 * px, 3 * px); });
}
const foot = () => `<div class="foot"><div class="logo">${LOGO}Draw It Out</div><div class="joinline">Join at <span class="site">${SITE}</span> · code <b>${CODE}</b></div></div>`;
const Q = () => (S.q === 'long' ? Q_LONG : Q_SHORT);
const nm = (k, i) => (S.hide ? 'Student ' + (i + 1) : k.n);

function view() {
  const el = $('#screen'); const v = S.v; let h = '';
  if (v === 'join') h = `<div class="q big">${Q()}</div><div class="join"><div class="jl">Go to <span>${SITE}</span><b>${CODE}</b></div><div class="jr"><div class="qr"><canvas id="qrc" role="img" aria-label="QR code to join"></canvas></div><div class="jcap">or scan to join</div></div></div>${foot()}`;
  if (v === 'one' || v === 'compare') {
    const kids = v === 'one' ? [KIDS[0]] : KIDS;
    h = `<div class="q">${Q()}</div><div class="stagebody"><div class="tiles">${kids.map((k, i) => `<div class="tile"><div class="lab"><span class="nm">${nm(k, i)}’s work</span><span class="pc ${k.p}">${PE[k.p]} ${PW[k.p]}</span></div><div class="art"><canvas data-k="${i}"></canvas></div></div>`).join('')}</div></div>${foot()}`;
  }
  if (v === 'lb' || v === 'lb0') h = `<div class="q">${Q()}</div><div class="stagebody"><div class="lb${v === 'lb0' ? ' even' : ''}" id="lbbox"></div>${v === 'lb0' ? '<div class="lbnote">First point wins the lead</div>' : ''}</div>${foot()}`;
  if (v === 'sort') h = `<div class="q">${Q_SORT}</div><div class="stagebody"><div class="res">
    <div><h2>Which ideas are working?</h2>
     ${bar('How it forms', 85, true)}${bar('Example rocks', 53)}${bar('Clues you can see', 45)}</div>
    <div><h2>Let’s look at these again</h2>
     ${bar('Bands of mineral crystals', 22)}${bar('Marble', 44)}${bar('Slate', 44)}</div></div></div>${foot()}`;
  if (v === 'frozen') h = `<div class="frz" id="frz"><span class="fi" aria-hidden="true">✋</span><b>Class frozen</b><p>Look at your teacher.</p></div>${foot()}`;
  if (v === 'wait') h = `<div class="wait"><div class="cn">3rd Hour</div><p>The next question is coming up</p><div class="jbig">Join at ${SITE} · code <b>${CODE}</b></div></div>${foot()}`;
  el.innerHTML = h;
  if (v === 'join') qr($('#qrc'));
  $$('canvas[data-k]').forEach(cv => art(cv, +cv.dataset.k));
  if (v === 'compare') $('.tiles').classList.add('three'); else if (v === 'one') $('.tiles').style.gridTemplateColumns = 'minmax(0,1fr)';
  if (v === 'one') { const t = $('.tile'); t.style.maxWidth = '78%'; t.style.margin = '0 auto'; t.style.width = '100%'; }
  if (v === 'frozen') { const f = $('#frz'); for (let i = 0; i < 14; i++) { const s = document.createElement('i'); s.className = 'flake'; s.textContent = '❄'; s.style.left = (i * 7.3 + 2) + '%'; s.style.animationDuration = (7 + (i * 5) % 6) + 's'; s.style.animationDelay = (-(i * 3) % 9) + 's'; f.append(s); } }
  if (v === 'lb' || v === 'lb0') lb(true);
  $('#lbctl').hidden = !(v === 'lb' || v === 'lb0'); $('#namesctl').hidden = !(v === 'one' || v === 'compare');
  $('#addpt').hidden = v !== 'lb'; $('#resetpt').hidden = v !== 'lb';
  $$('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  fit();
}
const bar = (t, p, best) => `<div class="bar${best ? ' best' : ''}"><div class="t">${best ? `<span class="ok" title="Best understood">${CHECK}</span>` : ''}${t}</div><div class="trk"><div class="b"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div></div>`;

/* leaderboard: rows are absolutely placed so they can slide when the order changes */
let rowEls = [];
function lb(build) {
  const box = $('#lbbox'); if (!box) return; const n = S.n, zero = S.v === 'lb0';
  const teams = TEAMS.slice(0, n).map((t, i) => ({ ...t, i, s: zero ? 0 : S.pts[i] }));
  const order = teams.slice().sort((a, b) => b.s - a.s || a.i - b.i), max = Math.max(1, ...teams.map(t => t.s));
  box.style.setProperty('--n', n);
  if (build) { box.innerHTML = ''; rowEls = teams.map(t => { const r = document.createElement('div'); r.className = 'row'; r.style.setProperty('--tc', t.c); r.innerHTML = `<div class="fill"></div><div class="in"><div class="plate"><span class="rk"></span><span class="em">${t.e}</span><span class="tn">${t.n}</span><span class="crown" hidden>${CROWN}</span></div><span class="sp"></span><div class="plate sc"></div></div>`; box.append(r); return r; }); }
  order.forEach((t, rank) => {
    const r = rowEls[t.i]; r.style.setProperty('--i', rank);
    r.style.setProperty('--w', zero ? '100%' : Math.max(t.s ? 18 : 0, Math.round(t.s / max * 100)) + '%');
    r.querySelector('.rk').textContent = rank + 1; r.querySelector('.sc').textContent = t.s;
    r.querySelector('.crown').hidden = !(t.s > 0 && rank === 0 && (!order[1] || order[1].s < t.s));
  });
}

/* scale the fixed-size screen to fit the window */
function fit() {
  const [w, h] = S.size.split('x').map(Number), room = $('#room'), sc = Math.min((room.clientWidth - 24) / w, (room.clientHeight - 24) / h, 1.6);
  const s = $('#screen'), f = $('#fit'); s.style.width = w + 'px'; s.style.height = h + 'px'; s.style.transform = `scale(${sc})`; f.style.width = w * sc + 'px'; f.style.height = h * sc + 'px';
}
$$('#views button').forEach(b => b.onclick = () => { S.v = b.dataset.v; view(); });
$$('#sizes button').forEach(b => b.onclick = () => { S.size = b.dataset.s; $$('#sizes button').forEach(x => x.setAttribute('aria-pressed', x === b)); fit(); });
$$('#qlen button').forEach(b => b.onclick = () => { S.q = b.dataset.q; $$('#qlen button').forEach(x => x.setAttribute('aria-pressed', x === b)); view(); });
$$('#nteams button').forEach(b => b.onclick = () => { S.n = +b.dataset.n; $$('#nteams button').forEach(x => x.setAttribute('aria-pressed', x === b)); lb(true); });
$('#addpt').onclick = () => { const i = S.nextPt++ % S.n; S.pts[i] += 1 + (i % 2); lb(false); };
$('#resetpt').onclick = () => { S.pts.fill(0); S.nextPt = 0; lb(false); };
$('#hidenames').onchange = e => { S.hide = e.target.checked; view(); };
addEventListener('resize', fit);
S.pts = [3, 5, 1, 2, 0, 4, 1, 2]; S.nextPt = 0;
view();
</script>
